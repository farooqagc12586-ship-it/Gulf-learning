<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الکریم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        .header {
            background: #107c41;
            color: white;
            text-align: center;
            padding: 18px 15px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .controls {
            padding: 15px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }

        .select-box {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            outline: none;
            cursor: pointer;
            color: #333;
        }

        .select-box:focus {
            border-color: #107c41;
        }

        .list-container {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px 15px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .list-item:hover {
            background-color: #f5f5f5;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .item-title {
            font-size: 16px;
            font-weight: 500;
        }

        .radio-btn {
            width: 18px;
            height: 18px;
            accent-color: #107c41;
            cursor: pointer;
        }

        .content-area {
            padding: 20px 15px;
            text-align: center;
            font-size: 18px;
            line-height: 1.8;
            color: #222;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>القرآن الکریم</h1>
    </div>

    <div class="controls">
        <select id="selectionType" class="select-box" onchange="loadList()">
            <option value="surah">سورۃ منتخب کریں</option>
            <option value="para">پارہ منتخب کریں</option>
        </select>
    </div>

    <div class="list-container" id="itemsList">
        <!-- لسٹ یہاں لوڈ ہوگی -->
    </div>
</div>

<script>
    // سورۃ کی لسٹ
    const surahs = [
        "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
        "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
        "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
        "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
        "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
        "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
        "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
        "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
        "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
        "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
        "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "المواعون", "الكوثر", "الكافرون", "النصر",
        "المسد", "الإخلاص", "الفلق", "الناس"
    ];

    // لسٹ لوڈ کرنے کا فنکشن
    function loadList() {
        const type = document.getElementById("selectionType").value;
        const container = document.getElementById("itemsList");
        container.innerHTML = "";

        if (type === "surah") {
            surahs.forEach((surah, index) => {
                const item = document.createElement("div");
                item.className = "list-item";
                item.onclick = () => selectItem(index + 1, surah, "surah");

                item.innerHTML = `
                    <span class="item-title">${index + 1}. ${surah}</span>
                    <input type="radio" name="quran_item" class="radio-btn" value="${index + 1}">
                `;
                container.appendChild(item);
            });
        } else if (type === "para") {
            for (let i = 1; i <= 30; i++) {
                const item = document.createElement("div");
                item.className = "list-item";
                item.onclick = () => selectItem(i, `پارہ ${i}`, "para");

                item.innerHTML = `
                    <span class="item-title">پارہ ${i}</span>
                    <input type="radio" name="quran_item" class="radio-btn" value="${i}">
                `;
                container.appendChild(item);
            }
        }
    }

    // آئٹم سلیکٹ کرنے کا فنکشن
    function selectItem(id, name, type) {
        const radios = document.getElementsByName("quran_item");
        radios.forEach(radio => {
            if (radio.value == id) radio.checked = true;
        });
        console.log(`Selected ${type}: ${id} - ${name}`);
    }

    // پیج لوڈ ہوتے ہی سورۃ کی لسٹ خود بخود دکھائیں
    window.onload = function() {
        loadList();
    };
</script>

</body>
</html>
