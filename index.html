<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>HSE Professional Examination</title>
<style>
:root{
  --bg:#0a1120; --bg2:#0e172a; --card:#131d33; --card2:#1a2740; --line:#25355a;
  --txt:#e9eefb; --muted:#93a4c6; --acc:#22c55e; --acc2:#3b82f6; --acc3:#8b5cf6;
  --warn:#f59e0b; --bad:#ef4444; --good:#22c55e; --gold:#fbbf24; --silver:#cbd5e1;
  --diamond:#22d3ee; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;overscroll-behavior-y:none}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,#16264a 0%,var(--bg) 60%)}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit}
.hidden{display:none !important}

.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

/* ---------- TOP BAR ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px;background:rgba(10,17,32,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),#0ea5e9);color:#04140a;font-weight:900;font-size:12px;letter-spacing:.5px;
  box-shadow:0 4px 14px rgba(34,197,94,.28)}
.brand-title{font-weight:800;font-size:14px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:9.5px;color:var(--muted);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topRight{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.timer-chip{display:flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);
  padding:7px 11px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}

/* ---------- LAYOUT ---------- */
#screen{flex:1;padding:14px 14px 100px}
.card{background:linear-gradient(180deg,var(--card),#111a2c);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.mt12{margin-top:12px}

/* ---------- BUTTONS ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:13px;
  font-weight:800;font-size:15px;background:var(--card2);border:1px solid var(--line);color:var(--txt);
  transition:transform .08s ease}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(135deg,#22c55e,#16a34a);color:#04140a;border-color:transparent;
  box-shadow:0 6px 20px rgba(34,197,94,.28)}

/* ---------- EXAM ---------- */
.qtext{font-size:16.5px;font-weight:700;line-height:1.5;margin:6px 0 14px}
.opt{display:flex;gap:11px;align-items:center;width:100%;text-align:left;padding:13px 14px;border-radius:13px;
  background:var(--card);border:1.5px solid var(--line);margin-bottom:9px;transition:all .14s ease;font-size:14.5px}
.opt:active{transform:scale(.99)}
.opt .key{width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:11.5px;font-weight:900;color:var(--muted)}
.opt.sel{border-color:var(--acc);background:rgba(34,197,94,.10)}
.opt.sel .key{background:var(--acc);color:#04140a;border-color:transparent}
.opt.correct{border-color:var(--good);background:rgba(34,197,94,.2)}
.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.2)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">HSE</div>
      <div style="min-width:0">
        <div class="brand-title">HSE Professional Exam</div>
        <div class="brand-sub">NEBOSH · OSHA · IOSH · ISO 45001</div>
      </div>
    </div>
    <div id="topRight">
      <div class="timer-chip" id="timer">10:00</div>
    </div>
  </header>
  
  <main id="screen"></main>
</div>

<script>
"use strict";

const questions = [
  {
    q: "What is the primary objective of a Risk Assessment in workplace health & safety?",
    opts: [
      "To eliminate all workplace hazards completely",
      "To identify hazards and implement adequate control measures",
      "To fulfill insurance policy documentation requirements",
      "To pass government inspections without penalties"
    ],
    ans: 1
  },
  {
    q: "According to the Hierarchy of Controls, which method is considered the most effective?",
    opts: [
      "Personal Protective Equipment (PPE)",
      "Engineering Controls",
      "Elimination",
      "Administrative Controls"
    ],
    ans: 2
  },
  {
    q: "Under ISO 45001, what does PDCA stand for?",
    opts: [
      "Plan-Do-Check-Act",
      "Prevent-Detect-Control-Assess",
      "Prepare-Document-Comply-Analyze",
      "Policy-Design-Check-Audit"
    ],
    ans: 0
  }
];

let currentQ = 0;
let score = 0;
let selectedOpt = null;

const screenEl = document.getElementById("screen");

function renderQuestion() {
  if (currentQ >= questions.length) {
    renderResult();
    return;
  }
  
  const qData = questions[currentQ];
  selectedOpt = null;
  
  screenEl.innerHTML = `
    <div class="card">
      <div class="muted tiny" style="font-weight:800;letter-spacing:1px;text-transform:uppercase;">Question ${currentQ + 1} of ${questions.length}</div>
      <div class="qtext">${qData.q}</div>
      
      <div id="optionsContainer">
        ${qData.opts.map((opt, i) => `
          <button class="opt" onclick="selectOption(${i})">
            <span class="key">${String.fromCharCode(65 + i)}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      
      <button id="nextBtn" class="btn primary mt12" onclick="nextQuestion()" disabled>Next Question</button>
    </div>
  `;
}

function selectOption(index) {
  selectedOpt = index;
  const opts = document.querySelectorAll(".opt");
  opts.forEach((btn, i) => {
    if (i === index) {
      btn.classList.add("sel");
    } else {
      btn.classList.remove("sel");
    }
  });
  document.getElementById("nextBtn").disabled = false;
}

function nextQuestion() {
  if (selectedOpt === questions[currentQ].ans) {
    score++;
  }
  currentQ++;
  renderQuestion();
}

function renderResult() {
  const percentage = Math.round((score / questions.length) * 100);
  screenEl.innerHTML = `
    <div class="card" style="text-align:center;padding:30px 16px;">
      <h2 style="margin:0 0 10px;">Examination Completed</h2>
      <div style="font-size:48px;font-weight:900;color:var(--acc);">${percentage}%</div>
      <p class="muted">You scored ${score} out of ${questions.length}</p>
      <button class="btn primary mt12" onclick="restart()">Try Again</button>
    </div>
  `;
}

function restart() {
  currentQ = 0;
  score = 0;
  renderQuestion();
}

// Start app
renderQuestion();
</script>
</body>
</html>
