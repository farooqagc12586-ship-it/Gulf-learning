<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta name="google-site-verification" content="-m9HgPpN-zaagHUZo-M5eZsDefQpH0ndXzK6TXI0hk4" />
  
<meta charset="UTF-8">

<title>قرآن مجید | تلاوت و اردو ترجمہ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f4f7f5;
color:#17231e;
font-family:Arial,"KFGQPC UTHMAN TAHA NASKH REGULAR",sans-serif;
padding-bottom:105px
}

header{
background:linear-gradient(135deg,#063c2d,#087657);
color:#fff;
padding:25px 15px;
text-align:center;
box-shadow:0 3px 15px #0003
}

header h1{
margin:0;
font-size:30px
}

header p{
margin:8px 0 0;
font-size:14px
}

.container{
max-width:1050px;
margin:auto;
padding:15px
}

.modes{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:15px
}

.mode{
border:0;
padding:15px;
border-radius:12px;
background:#fff;
color:#07563f;
font-weight:bold;
cursor:pointer;
box-shadow:0 2px 10px #0001
}

.mode.active{
background:#087657;
color:white
}

.panel{
background:#fff;
padding:15px;
border-radius:16px;
box-shadow:0 2px 12px #0001;
margin-bottom:15px
}

.selects{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

select{
width:100%;
padding:13px;
border:1px solid #ccd8d2;
border-radius:10px;
background:#fff;
font-size:15px
}

.status{
margin-top:10px;
background:#eef8f3;
color:#07563f;
padding:10px;
border-radius:10px;
text-align:center
}

.quran{
background:#fff;
border-radius:18px;
padding:20px;
box-shadow:0 2px 12px #0001
}

.title{
text-align:center;
border-bottom:1px solid #ddd;
padding-bottom:15px;
margin-bottom:15px
}

.title h2{
margin:0;
color:#07563f
}

.bismillah{
font-family:"Times New Roman",serif;
font-size:28px;
margin-top:10px
}

.ruku{
text-align:center;
margin:18px 0 5px;
padding:8px;
border-radius:8px;
background:#edf7f2;
color:#087657;
font-size:13px
}

.ayah{
padding:22px 8px;
border-bottom:1px solid #e5e9e7;
cursor:pointer;
border-radius:12px
}

.ayah.active{
background:#edf8f4
}

.arabic{
font-family:"Times New Roman",serif;
font-size:31px;
line-height:2.15;
text-align:right;
margin-bottom:13px
}

.translation{
font-family:"SCHEHERAZADE","Times New Roman",serif;
font-size:20px;
line-height:2;
color:#3d4843
}

.num{
display:inline-flex;
width:34px;
height:34px;
align-items:center;
justify-content:center;
border-radius:50%;
background:#087657;
color:#fff;
font-family:Arial;
font-size:13px;
margin-left:7px;
vertical-align:middle
}

.hidden{
display:none!important
}

.loading{
padding:40px;
text-align:center;
color:#087657
}

.player{
position:fixed;
bottom:0;
left:0;
right:0;
background:#063c2d;
color:white;
padding:9px;
z-index:1000;
box-shadow:0 -3px 15px #0004
}

.now{
text-align:center;
font-size:12px;
margin-bottom:7px
}

.playerButtons{
max-width:700px;
margin:auto;
display:grid;
grid-template-columns:1fr 1.25fr 1fr;
gap:8px
}

.player button{
border:0;
padding:13px 5px;
border-radius:10px;
font-weight:bold;
font-size:15px;
cursor:pointer
}

.prev,.next{
background:#e0eee9;
color:#07563f
}

.play{
background:#fff;
color:#07563f
}

@media(max-width:650px){

.modes{
grid-template-columns:1fr
}

.selects{
grid-template-columns:1fr
}

.arabic{
font-size:27px
}

.translation{
font-size:18px
}

.quran{
padding:12px
}

header h1{
font-size:24px
}
}
</style>
</head>

<body>

<header>
<h1>القرآن الكريم</h1>
<p>تلاوتِ عبدالباسط عبدالصمد — اردو ترجمۂ فتح محمد جالندھری</p>
</header>

<div class="container">

<div class="modes">

<button class="mode active" data-mode="both">
قرآن بمع ترجمہ
</button>

<button class="mode" data-mode="quran">
صرف قرآن تلاوت
</button>

<button class="mode" data-mode="urdu">
صرف اردو ترجمہ
</button>

</div>

<div class="panel">

<div class="selects">

<select id="surah">
<option value="">سورت منتخب کریں</option>
</select>

<select id="ayah">
<option value="">آیت منتخب کریں</option>
</select>

</div>

<div class="status" id="status">
114 سورتوں کی فہرست لوڈ ہو رہی ہے...
</div>

</div>

<div class="quran" id="quran">

<div class="loading">
سورت منتخب کریں
</div>

</div>

</div>


<audio id="arabicAudio"></audio>
<audio id="urduAudio"></audio>


<div class="player">

<div class="now" id="now">
کوئی آیت منتخب نہیں
</div>

<div class="playerButtons">

<button class="prev" id="prev">
◀ پچھلی آیت
</button>

<button class="play" id="play">
▶ چلائیں
</button>

<button class="next" id="next">
اگلی آیت ▶
</button>

</div>

</div>


<script>

const API="https://api.alquran.cloud/v1";

/*
  Text
*/

const ARABIC="quran-uthmani";
const URDU="ur.jalandhry";

/*
  Audio

  Abdul Basit:
  https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/

  Shamshad:
  https://everyayah.com/data/translations/urdu_shamshad_ali_khan_46kbps/
*/

const BASIT=
"https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/";

const SHAMSHAD=
"https://everyayah.com/data/translations/urdu_shamshad_ali_khan_46kbps/";


let mode="both";
let surahData=[];
let currentSurah=null;
let currentIndex=0;
let playing=false;
let stage="arabic";


const surahBox=document.getElementById("surah");
const ayahBox=document.getElementById("ayah");
const quran=document.getElementById("quran");
const status=document.getElementById("status");

const arabicAudio=document.getElementById("arabicAudio");
const urduAudio=document.getElementById("urduAudio");

const playBtn=document.getElementById("play");
const prevBtn=document.getElementById("prev");
const nextBtn=document.getElementById("next");

const now=document.getElementById("now");


/* ============================
   LOAD SURAH LIST
============================ */

async function loadSurahList(){

try{

const r=await fetch(API+"/surah");

if(!r.ok) throw Error();

const json=await r.json();

json.data.forEach(s=>{

const option=document.createElement("option");

option.value=s.number;

option.textContent=
`${s.number}. ${s.name} — ${s.englishName}`;

surahBox.appendChild(option);

});

status.textContent="سورت منتخب کریں";

}catch(e){

status.textContent=
"سورتوں کی فہرست لوڈ نہیں ہو سکی۔ Internet چیک کریں۔";

}

}


/* ============================
   LOAD SURAH
============================ */

async function loadSurah(id){

stop();

quran.innerHTML=
`<div class="loading">سورت اور اردو ترجمہ لوڈ ہو رہا ہے...</div>`;

try{

/*
  دونوں editions ایک request میں
*/

const url=
`${API}/surah/${id}/editions/${ARABIC},${URDU}`;

const r=await fetch(url);

if(!r.ok) throw Error();

const json=await r.json();

const arabic=
json.data.find(
x=>x.edition.identifier===ARABIC
);

const urdu=
json.data.find(
x=>x.edition.identifier===URDU
);

if(!arabic)
throw Error("Arabic data unavailable");

if(!urdu)
throw Error("Urdu translation unavailable");


currentSurah=arabic;

surahData=
arabic.ayahs.map((a,i)=>({

number:a.numberInSurah,

global:a.number,

ruku:a.ruku,

arabic:a.text,

urdu:
urdu.ayahs[i]
?urdu.ayahs[i].text
:""

}));

currentIndex=0;

render();

makeAyahList();

status.textContent=
`${arabic.name} — ${surahData.length} آیات`;

selectAyah(0,false);

}catch(e){

console.error(e);

quran.innerHTML=
`
<div class="loading">

<b>ترجمہ یا قرآن کا ڈیٹا لوڈ نہیں ہو سکا۔</b>

<br><br>

براہِ کرم Internet connection چیک کریں۔

</div>
`;

status.textContent=
"ڈیٹا لوڈ کرنے میں مسئلہ آیا۔";

}

}


/* ============================
   RENDER
============================ */

function render(){

let html=`

<div class="title">

<h2>${currentSurah.name}</h2>

<div>${currentSurah.englishName}</div>

<div class="bismillah">
بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ
</div>

</div>
`;

let lastRuku=null;

surahData.forEach((a,i)=>{

if(a.ruku && a.ruku!==lastRuku){

html+=
`<div class="ruku">رکوع ${a.ruku}</div>`;

lastRuku=a.ruku;

}

html+=`

<div
class="ayah"
id="ayah-${i}"
onclick="selectAyah(${i},true)"
>

<div class="arabic ${mode==="urdu"?"hidden":""}">

<span class="num">
${a.number}
</span>

${a.arabic}

</div>

<div class="translation ${mode==="quran"?"hidden":""}">

${a.urdu || "اردو ترجمہ دستیاب نہیں"}

</div>

</div>
`;

});

quran.innerHTML=html;

}


/* ============================
   AYAH LIST
============================ */

function makeAyahList(){

ayahBox.innerHTML=
`<option value="">آیت منتخب کریں</option>`;

surahData.forEach((a,i)=>{

const o=document.createElement("option");

o.value=i;

o.textContent=
`آیت ${a.number}`;

ayahBox.appendChild(o);

});

}


/* ============================
   SELECT AYAH
============================ */

function selectAyah(index,auto){

if(!surahData.length) return;

if(index<0)
index=0;

if(index>=surahData.length)
index=surahData.length-1;

currentIndex=index;

ayahBox.value=index;

document
.querySelectorAll(".ayah")
.forEach(x=>x.classList.remove("active"));

const el=
document.getElementById("ayah-"+index);

if(el){

el.classList.add("active");

el.scrollIntoView({
behavior:"smooth",
block:"center"
});

}

const a=surahData[index];

now.textContent=
`${currentSurah.name} — آیت ${a.number}`;

if(auto)
playCurrent();

}


/* ============================
   FILE NAME
============================ */

function fileName(){

return String(currentSurah.number)
.padStart(3,"0")
+
String(
surahData[currentIndex].number
).padStart(3,"0")
+
".mp3";

}


/* ============================
   PLAY CURRENT
============================ */

function playCurrent(){

if(!surahData.length)
return;

stopAudioOnly();

playing=true;

updateButton();

selectAyah(currentIndex,false);

const file=fileName();

if(mode==="quran"){

stage="arabic";

arabicAudio.src=BASIT+file;

arabicAudio.play().catch(()=>{

playing=false;
updateButton();

});

return;

}

if(mode==="urdu"){

stage="urdu";

urduAudio.src=SHAMSHAD+file;

urduAudio.play().catch(()=>{

playing=false;
updateButton();

});

return;

}

/*
  BOTH
*/

stage="arabic";

arabicAudio.src=BASIT+file;

arabicAudio.play().catch(()=>{

playing=false;
updateButton();

});

}


/* ============================
   ARABIC ENDED
============================ */

arabicAudio.onended=()=>{

if(!playing)
return;

if(mode==="both"){

stage="urdu";

const file=fileName();

urduAudio.src=SHAMSHAD+file;

urduAudio.play().catch(()=>{

goNext();

});

}else{

goNext();

}

};


/* ============================
   URDU ENDED
============================ */

urduAudio.onended=()=>{

if(!playing)
return;

goNext();

};


/* ============================
   AUTO NEXT
============================ */

function goNext(){

if(currentIndex<
surahData.length-1){

currentIndex++;

selectAyah(
currentIndex,
false
);

setTimeout(
playCurrent,
200
);

}else{

playing=false;

updateButton();

now.textContent=
`${currentSurah.name} مکمل ہو گئی`;

}

}


/* ============================
   PLAY / PAUSE
============================ */

playBtn.onclick=()=>{

if(!surahData.length)
return;

if(playing){

arabicAudio.pause();
urduAudio.pause();

playing=false;

updateButton();

return;

}

const audio=
stage==="urdu"
?urduAudio
:arabicAudio;

if(audio.src && audio.currentTime>0){

audio.play().then(()=>{

playing=true;
updateButton();

}).catch(()=>{

playCurrent();

});

}else{

playCurrent();

}

};


/* ============================
   NEXT
============================ */

nextBtn.onclick=()=>{

if(!surahData.length)
return;

if(currentIndex<
surahData.length-1){

currentIndex++;

selectAyah(
currentIndex,
true
);

}

};


/* ============================
   PREVIOUS
============================ */

prevBtn.onclick=()=>{

if(!surahData.length)
return;

if(currentIndex>0){

currentIndex--;

selectAyah(
currentIndex,
true
);

}

};


/* ============================
   STOP
============================ */

function stopAudioOnly(){

arabicAudio.pause();
urduAudio.pause();

}

function stop(){

stopAudioOnly();

arabicAudio.removeAttribute("src");
urduAudio.removeAttribute("src");

playing=false;

updateButton();

}


/* ============================
   BUTTON
============================ */

function updateButton(){

playBtn.textContent=
playing
?"⏸ روکیں"
:"▶ چلائیں";

}


/* ============================
   SURAH CHANGE
============================ */

surahBox.onchange=()=>{

if(surahBox.value)
loadSurah(surahBox.value);

};


/* ============================
   AYAH CHANGE
============================ */

ayahBox.onchange=()=>{

if(ayahBox.value!==""){

selectAyah(
Number(ayahBox.value),
true
);

}

};


/* ============================
   MODES
============================ */

document
.querySelectorAll(".mode")
.forEach(btn=>{

btn.onclick=()=>{

document
.querySelectorAll(".mode")
.forEach(x=>
x.classList.remove("active")
);

btn.classList.add("active");

mode=btn.dataset.mode;

stop();

if(currentSurah){

render();

selectAyah(
currentIndex,
false
);

}

};

});


/* ============================
   KEYBOARD
============================ */

document.onkeydown=e=>{

if(e.code==="Space"){

e.preventDefault();

playBtn.click();

}

if(e.key==="ArrowRight")
nextBtn.click();

if(e.key==="ArrowLeft")
prevBtn.click();

};


/* ============================
   START
============================ */

loadSurahList();

</script>

</body>
</html>
