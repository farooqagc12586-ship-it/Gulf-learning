            direction: rtl;

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header Banner with Integrated Name at Top Right */
        .header-banner {
            position: relative;
            background: linear-gradient(135deg, #0e3b2e 0%, #175241 100%);
            color: var(--accent-gold);
            text-align: center;
            padding: 32px 15px 22px 15px;
            border-radius: 16px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 10px 25px rgba(14, 59, 46, 0.15);
            margin-bottom: 20px;

        .top-credit-name {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 12px;
            color: var(--accent-gold);
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .header-banner h1 {
            font-family: 'Scheherazade New', serif;
            font-size: 34px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header-banner p {
            color: #e0e0e0;
            font-size: 13px;
            margin: 8px 0 0 0;
        }

        /* Controls Card */
        .controls-card {
            background: var(--card-white);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: var(--primary-emerald);
            font-weight: bold;
        }

        select, input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            height: 46px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            color: #1f2937;
            font-family: inherit;
            direction: rtl;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-gold);
        }

        .btn-load {
            height: 46px;
            background: linear-gradient(135deg, #0e3b2e 0%, #175241 100%);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(14, 59, 46, 0.2);
        }

        .btn-load:hover {
            background: var(--accent-gold);
            color: var(--primary-emerald);
        }

        /* Sticky Player Bar */
        .player-bar {
            position: sticky;
            top: 10px;
            background: var(--primary-emerald);
            border: 1px solid var(--accent-gold);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .player-status {
            font-size: 13px;
            color: var(--light-gold);
        }

        .player-controls {
            display: flex;
            gap: 8px;
        }

        .player-controls button {
            background: var(--accent-gold);
            color: var(--primary-emerald);
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Bismillah Card */
        .bismillah-card {
            background: linear-gradient(135deg, #fcf8ec 0%, #f4e8c1 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            padding: 18px 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .bismillah-card.playing {
            border: 2px solid var(--primary-emerald);
            background: #f5e6b3;
        }

        .bismillah-arabic {
            font-family: 'Scheherazade New', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-emerald);
            line-height: 1.8;
        }

        .bismillah-urdu {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 15px;
            color: #334155;
            margin-top: 8px;
            border-top: 1px dashed rgba(212, 175, 55, 0.5);
            padding-top: 8px;
        }

        /* Ayah Cards */

            background: var(--card-white);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #eaeaea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: all 0.3s ease;

            border: 2px solid var(--accent-gold);
            background-color: #fcf9f2;
        }

            font-size: 12px;
            color: var(--primary-emerald);
            background: var(--light-gold);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: bold;

            font-size: 30px;
            font-weight: 700;
            color: var(--primary-emerald);
            line-height: 2.2;
            text-align: right;
            margin-bottom: 14px;

            font-size: 17px;
            color: #334155;
            line-height: 2.2;
            text-align: right;
            border-top: 1px dashed #e2e8f0;
            padding-top: 12px;

            cursor: pointer;
            font-weight: bold;

            background: var(--primary-emerald);
            color: #ffffff;

1. **خالی لسٹ کا مسئلہ:** پہلے کوڈ میں ڈراپ ڈاؤن لسٹ کو بھرنے والا جاوا سکرپٹ فنکشن پیج لوڈ ہوتے ہی خود بخود ایگزیکیوٹ نہیں ہو رہا تھا، جس کی وجہ سے لسٹ خالی رہ جاتی تھی اور لیبل "سورۃ منتخب کریں" پر ہی اٹکا رہتا تھا (جیسے آپ کی امیج میں "پارہ وائز" منتخب کرنے پر بھی نیچے لسٹ نہیں بن رہی تھی)۔
2. **نام نظر نہ آنے کا مسئلہ:** CSS میں نیگیٹو پوزیشن (`top: -5px`) استعمال کی گئی تھی جس کی وجہ سے آپ کا نام اسکرین کے اوپر والے بارڈر کے پیچھے چھپ کر کٹ جاتا تھا۔

ان دونوں مسئلوں کو کوڈ میں اس طرح ٹھیک کیا گیا ہے:
* `DOMContentLoaded` کا ایونٹ شامل کیا گیا ہے جو پیج کھلتے ہی تمام سورتوں یا پاروں کی لسٹ خود بخود فوراً بنا دے گا۔
* نام کو ایک واضح **گولڈن بیج (Badge)** کی شکل میں اوپر دائیں کونے پر پوزیشن کر دیا گیا ہے تاکہ یہ ہر اسکرین پر نمایاں نظر آئے اور چھپ نہ سکے۔
