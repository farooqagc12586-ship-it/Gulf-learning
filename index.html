<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Quran Majeed - Farooq Ahmed Chitrali</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'QPC_Uthmanic';
            src: url('https://fonts.gstatic.com/s/amiri/v26/J7afpE98nkS_GHlxV04pXw.woff2'); /* Fallback to Amiri for web demo */
        }

        :root {
            --primary-color: #065f46;
            --bg-color: #f0fdf4;
        }

        body {
            font-family: 'Scheherazade New', serif;
            background-color: var(--bg-color);
            transition: all 0.5s ease;
        }

        .quran-arabic {
            font-family: 'QPC_Uthmanic', serif;
            font-size: 2.5rem;
            line-height: 4rem;
            word-spacing: 5px;
        }

        .urdu-text {
            font-family: 'Scheherazade New', serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #374151;
        }

        .category-card {
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .category-card:hover {
            transform: translateY(-5px);
        }

        /* Color Themes */
        .theme-both { --primary-color: #065f46; --bg-color: #f0fdf4; }
        .theme-arabic { --primary-color: #1e40af; --bg-color: #eff6ff; }
        .theme-urdu { --primary-color: #92400e; --bg-color: #fffbeb; }

        .sticky-audio {
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="theme-both">

    <!-- Header -->
    <header class="bg-[var(--primary-color)] text-white p-6 shadow-lg text-center">
        <h1 class="text-4xl mb-2">القرآن الكريم</h1>
        <p class="text-xl opacity-90">Urdu Translation: Fateh Muhammad Jalandhari</p>
    </header>

    <!-- Category Selector 1: Voice Mode -->
    <div class="container mx-auto mt-8 px-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
            <button onclick="setVoiceMode('ayat')" class="bg-white p-4 rounded-lg shadow border-b-4 border-emerald-600 hover:bg-emerald-50">Ayat Voice (Abdul Basit)</button>
            <button onclick="setVoiceMode('para')" class="bg-white p-4 rounded-lg shadow border-b-4 border-emerald-600 hover:bg-emerald-50">Para Voice</button>
            <button onclick="setVoiceMode('surah')" class="bg-white p-4 rounded-lg shadow border-b-4 border-emerald-600 hover:bg-emerald-50">Surah Voice</button>
        </div>
    </div>

    <!-- Category Selector 2: Display Mode -->
    <div class="container mx-auto mt-6 px-4">
        <div class="flex flex-wrap justify-center gap-4">
            <button onclick="setDisplay('both')" class="px-6 py-2 rounded-full bg-emerald-800 text-white">Quran with Urdu</button>
            <button onclick="setDisplay('arabic')" class="px-6 py-2 rounded-full bg-blue-800 text-white">Quran Only</button>
            <button onclick="setDisplay('urdu')" class="px-6 py-2 rounded-full bg-amber-800 text-white">Urdu Only</button>
        </div>
    </div>

    <!-- Main Content -->
    <main id="quran-container" class="container mx-auto mt-10 p-4 mb-32">
        <div id="surah-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Surahs will be loaded here -->
            <p class="text-center col-span-full">Loading Holy Quran...</p>
        </div>
        <div id="verses-display" class="hidden space-y-8">
            <button onclick="showSurahList()" class="mb-4 text-emerald-700 font-bold underline">← Back to Surah List</button>
            <div id="bismillah-area" class="text-center mb-10 hidden">
                <div class="quran-arabic">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
                <div class="urdu-text mt-2">شروع اللہ کے نام سے جو بڑا مہربان نہایت رحم والا ہے</div>
            </div>
            <div id="content-area"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 w-full bg-white p-2 text-center border-t">
        <div id="audio-player-container" class="mb-2">
            <audio id="main-audio" controls class="mx-auto w-full max-w-2xl"></audio>
            <p id="audio-info" class="text-xs text-gray-500 mt-1">Reciter: Abdul Basit | Urdu: Shamshad Ali Khan</p>
        </div>
        <p class="text-[10px] text-gray-400 uppercase tracking-widest">Farooq Ahmed Chitrali</p>
    </footer>

    <script>
        let currentDisplay = 'both';
        let voiceMode = 'ayat';
        let allSurahs = [];

        // Initialize Application
        async function init() {
            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                allSurahs = data.data;
                renderSurahList();
            } catch (error) {
                console.error("Error loading Quran:", error);
            }
        }

        function renderSurahList() {
            const listEl = document.getElementById('surah-list');
            listEl.innerHTML = allSurahs.map(surah => `
                <div onclick="loadSurah(${surah.number}, '${surah.name}')" class="category-card bg-white p-6 rounded-xl shadow-md text-center border border-gray-100">
                    <div class="text-2xl font-bold text-emerald-700">${surah.number}</div>
                    <div class="text-xl quran-arabic">${surah.name}</div>
                    <div class="text-sm text-gray-500">${surah.englishName}</div>
                </div>
            `).join('');
        }

        async function loadSurah(id, name) {
            document.getElementById('surah-list').classList.add('hidden');
            document.getElementById('verses-display').classList.remove('hidden');
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = "Loading Verses...";

            // Bismillah Logic (Exclude Surah 9)
            const bismillahArea = document.getElementById('bismillah-area');
            if (id !== 9) {
                bismillahArea.classList.remove('hidden');
            } else {
                bismillahArea.classList.add('hidden');
            }

            try {
                // Fetch Arabic and Urdu Translation (Fateh Muhammad Jalandhari is ur.jalandhry)
                const [arRes, urRes] = await Promise.all([
                    fetch(`https://api.alquran.cloud/v1/surah/${id}/ar.abdulsamad`),
                    fetch(`https://api.alquran.cloud/v1/surah/${id}/ur.jalandhry`)
                ]);
                
                const arData = await arRes.json();
                const urData = await urRes.json();

                renderVerses(arData.data.ayahs, urData.data.ayahs);
            } catch (error) {
                contentArea.innerHTML = "Error loading content.";
            }
        }

        function renderVerses(arAyahs, urAyahs) {
            const contentArea = document.getElementById('content-area');
            let html = '';

            arAyahs.forEach((ayah, index) => {
                const urText = urAyahs[index].text;
                
                html += `
                    <div class="verse-block p-6 bg-white rounded-lg shadow-sm mb-4 text-right">
                        ${currentDisplay !== 'urdu' ? `<div class="quran-arabic mb-4">${ayah.text}</div>` : ''}
                        ${currentDisplay !== 'arabic' ? `<div class="urdu-text border-r-4 border-emerald-500 pr-4">${urText}</div>` : ''}
                        <div class="mt-4 flex gap-2">
                            <button onclick="playAudio('${ayah.audio}', ${ayah.number})" class="text-xs bg-emerald-100 px-3 py-1 rounded">Play Arabic</button>
                            <button onclick="playUrduAudio(${ayah.numberInSurah}, ${arAyahs[0].surah.number})" class="text-xs bg-amber-100 px-3 py-1 rounded">Play Urdu</button>
                        </div>
                    </div>
                `;
            });
            contentArea.innerHTML = html;
        }

        function setDisplay(type) {
            currentDisplay = type;
            document.body.className = `theme-${type}`;
            // Refresh current view if verses are open
            const visibleSurah = document.querySelector('.verse-block');
            if(visibleSurah) {
                // Simple logic to re-trigger current view
                alert("View updated to " + type + ". Please re-select the Surah to apply color theme perfectly.");
            }
        }

        function setVoiceMode(mode) {
            voiceMode = mode;
            alert("Voice Mode set to: " + mode.toUpperCase());
        }

        function playAudio(url) {
            const player = document.getElementById('main-audio');
            player.src = url;
            player.play();
        }

        function playUrduAudio(ayahNum, surahNum) {
            // Shamshad Ali Khan Audio API construction
            // format: https://cdn.islamic.network/quran/audio/192/ur.khan/{ayahGlobalId}.mp3
            const player = document.getElementById('main-audio');
            // This is a simplified proxy for the demo.
            // In a production app, you would calculate the Global Ayah ID.
            alert("Playing Urdu Translation (Shamshad Ali Khan)...");
        }

        function showSurahList() {
            document.getElementById('surah-list').classList.remove('hidden');
            document.getElementById('verses-display').classList.add('hidden');
        }

        init();
    </script>
</body>
</html>
