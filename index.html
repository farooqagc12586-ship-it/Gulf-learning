<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاروق چترالی آسان مارکیٹنگ</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Alpine.js for lightweight state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', 'Noto Nastaliq Urdu', sans-serif; }
        .pb-safe { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white pb-20"
      x-data="appData()" 
      :dir="currentLang === 'en' ? 'ltr' : 'rtl'">

    <!-- TOP HEADER -->
    <header class="bg-emerald-800 text-white p-4 sticky top-0 z-30 shadow-md">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="font-bold text-lg leading-tight" x-text="labels[currentLang].appName"></h1>
                <p class="text-xs text-emerald-200" x-text="labels[currentLang].tagline"></p>
            </div>
            <!-- Language Selector -->
            <select x-model="currentLang" class="bg-emerald-900 text-white text-xs px-2 py-1 rounded border border-emerald-700 outline-none">
                <option value="ur">اردو</option>
                <option value="en">English</option>
                <option value="ru">Roman Urdu</option>
                <option value="ar">العربية</option>
            </select>
        </div>
    </header>

    <!-- MAIN VIEWPORT -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 1. DASHBOARD VIEW -->
        <template x-if="currentTab === 'dashboard'">
            <div class="space-y-4">
                <!-- Welcome Banner -->
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center justify-between">
                    <div>
                        <span class="text-xs font-semibold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full" x-text="labels[currentLang].today"></span>
                        <h2 class="text-xl font-bold text-slate-800 mt-1" x-text="formatCurrency(calculateTodaySales())"></h2>
                        <p class="text-xs text-slate-500" x-text="labels[currentLang].todaySales"></p>
                    </div>
                    <div class="text-3xl text-emerald-600"><i class="fa-solid fa-chart-line"></i></div>
                </div>

                <!-- KPI Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-xs text-slate-500" x-text="labels[currentLang].todayProfit"></p>
                        <p class="text-lg font-bold text-emerald-600" x-text="formatCurrency(calculateTodayProfit())"></p>
                    </div>
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-xs text-slate-500" x-text="labels[currentLang].todayExpenses"></p>
                        <p class="text-lg font-bold text-rose-600" x-text="formatCurrency(calculateTodayExpenses())"></p>
                    </div>
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-xs text-slate-500" x-text="labels[currentLang].receivables"></p>
                        <p class="text-lg font-bold text-amber-600" x-text="formatCurrency(totalReceivables())"></p>
                    </div>
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                        <p class="text-xs text-slate-500" x-text="labels[currentLang].stockValue"></p>
                        <p class="text-lg font-bold text-blue-600" x-text="formatCurrency(totalStockValue())"></p>
                    </div>
                </div>

                <!-- Low Stock Alert -->
                <div x-show="lowStockProducts().length > 0" class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-r-xl">
                    <div class="flex items-center space-x-2 space-x-reverse">
                        <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
                        <span class="text-xs font-bold text-amber-800" x-text="labels[currentLang].lowStockAlert"></span>
                    </div>
                    <div class="mt-2 text-xs text-amber-900 space-y-1">
                        <template x-for="item in lowStockProducts()" :key="item.id">
                            <div class="flex justify-between">
                                <span x-text="item.name"></span>
                                <span class="font-bold" x-text="item.stock + ' left'"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Recent Transactions List -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
                    <h3 class="font-bold text-sm text-slate-700 mb-3" x-text="labels[currentLang].recentSales"></h3>
                    <div class="space-y-3">
                        <template x-for="sale in sales.slice(-3).reverse()" :key="sale.id">
                            <div class="flex justify-between items-center text-xs pb-2 border-b border-slate-100 last:border-none">
                                <div>
                                    <p class="font-bold text-slate-800" x-text="sale.customerName"></p>
                                    <p class="text-slate-400" x-text="sale.date"></p>
                                </div>
                                <div class="text-left">
                                    <p class="font-bold text-emerald-600" x-text="formatCurrency(sale.total)"></p>
                                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100" x-text="sale.paymentType"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- 2. SALES VIEW -->
        <template x-if="currentTab === 'sales'">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-lg" x-text="labels[currentLang].salesHistory"></h2>
                    <button @click="openModal('sale')" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> <span x-text="labels[currentLang].newSale"></span>
                    </button>
                </div>

                <div class="space-y-2">
                    <template x-for="sale in sales" :key="sale.id">
                        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm text-slate-800" x-text="sale.customerName"></p>
                                <p class="text-xs text-slate-400" x-text="sale.items.length + ' items • ' + sale.date"></p>
                            </div>
                            <div class="text-left">
                                <p class="font-bold text-emerald-600" x-text="formatCurrency(sale.total)"></p>
                                <button @click="shareWhatsAppInvoice(sale)" class="text-xs text-emerald-700 bg-emerald-50 px-2 py-1 rounded mt-1 border border-emerald-200">
                                    <i class="fa-brands fa-whatsapp"></i> Invoice
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- 3. PRODUCTS / INVENTORY VIEW -->
        <template x-if="currentTab === 'products'">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-lg" x-text="labels[currentLang].inventory"></h2>
                    <button @click="openModal('product')" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> <span x-text="labels[currentLang].addProduct"></span>
                    </button>
                </div>

                <div class="space-y-2">
                    <template x-for="item in products" :key="item.id">
                        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm text-slate-800" x-text="item.name"></p>
                                <p class="text-xs text-slate-500" x-text="'Cost: ' + formatCurrency(item.cost) + ' | Sale: ' + formatCurrency(item.price)"></p>
                            </div>
                            <div class="text-left">
                                <span class="text-xs font-bold px-2 py-1 rounded-full" 
                                      :class="item.stock <= item.minStock ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'"
                                      x-text="'Stock: ' + item.stock"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- 4. LEDGER VIEW -->
        <template x-if="currentTab === 'ledger'">
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold text-lg" x-text="labels[currentLang].customerLedger"></h2>
                    <button @click="openModal('customer')" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg font-bold flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> <span x-text="labels[currentLang].addCustomer"></span>
                    </button>
                </div>

                <div class="space-y-2">
                    <template x-for="cust in customers" :key="cust.id">
                        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm text-slate-800" x-text="cust.name"></p>
                                <p class="text-xs text-slate-400" x-text="cust.phone"></p>
                            </div>
                            <div class="text-left">
                                <p class="text-xs text-slate-500" x-text="labels[currentLang].balance"></p>
                                <p class="font-bold text-amber-600" x-text="formatCurrency(cust.balance)"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- 5. REPORTS VIEW -->
        <template x-if="currentTab === 'reports'">
            <div class="space-y-4">
                <h2 class="font-bold text-lg" x-text="labels[currentLang].reports"></h2>
                
                <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
                    <h3 class="font-bold text-sm text-slate-700 border-b pb-2" x-text="labels[currentLang].pnlSummary"></h3>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-500" x-text="labels[currentLang].totalRevenue"></span>
                        <span class="font-bold" x-text="formatCurrency(calculateTotalRevenue())"></span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-500" x-text="labels[currentLang].cogs"></span>
                        <span class="font-bold text-slate-700" x-text="formatCurrency(calculateTotalCOGS())"></span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-slate-500" x-text="labels[currentLang].todayExpenses"></span>
                        <span class="font-bold text-rose-600" x-text="formatCurrency(calculateTodayExpenses())"></span>
                    </div>
                    <div class="flex justify-between text-sm font-bold border-t pt-2">
                        <span x-text="labels[currentLang].netProfit"></span>
                        <span class="text-emerald-600" x-text="formatCurrency(calculateTotalRevenue() - calculateTotalCOGS() - calculateTodayExpenses())"></span>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- FLOATING QUICK ADD BUTTON (+) -->
    <div class="fixed bottom-20 left-1/2 -translate-x-1/2 z-40">
        <button @click="openModal('sale')" class="bg-emerald-600 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-emerald-700 transition active:scale-95 border-4 border-slate-100">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30">
        <div class="max-w-md mx-auto flex justify-around py-2 text-slate-500 text-xs">
            <button @click="currentTab = 'dashboard'" :class="currentTab === 'dashboard' ? 'text-emerald-700 font-bold' : ''" class="flex flex-col items-center">
                <i class="fa-solid fa-house text-lg mb-0.5"></i>
                <span x-text="labels[currentLang].navHome"></span>
            </button>
            <button @click="currentTab = 'sales'" :class="currentTab === 'sales' ? 'text-emerald-700 font-bold' : ''" class="flex flex-col items-center">
                <i class="fa-solid fa-cart-shopping text-lg mb-0.5"></i>
                <span x-text="labels[currentLang].navSales"></span>
            </button>
            <div class="w-8"></div> <!-- Spacer for Quick Action Button -->
            <button @click="currentTab = 'products'" :class="currentTab === 'products' ? 'text-emerald-700 font-bold' : ''" class="flex flex-col items-center">
                <i class="fa-solid fa-boxes-stacked text-lg mb-0.5"></i>
                <span x-text="labels[currentLang].navProducts"></span>
            </button>
            <button @click="currentTab = 'ledger'" :class="currentTab === 'ledger' ? 'text-emerald-700 font-bold' : ''" class="flex flex-col items-center">
                <i class="fa-solid fa-book text-lg mb-0.5"></i>
                <span x-text="labels[currentLang].navLedger"></span>
            </button>
        </div>
    </nav>

    <!-- NEW SALE MODAL -->
    <div x-show="activeModal === 'sale'" class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" x-cloak>
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-base" x-text="labels[currentLang].newSale"></h3>
                <button @click="activeModal = null" class="text-slate-400 text-lg">&times;</button>
            </div>

            <!-- Customer -->
            <div>
                <label class="text-xs font-semibold text-slate-600" x-text="labels[currentLang].customer"></label>
                <select x-model="newSale.customerId" class="w-full mt-1 p-2 border rounded-lg text-xs bg-slate-50">
                    <template x-for="c in customers" :key="c.id">
                        <option :value="c.id" x-text="c.name"></option>
                    </template>
                </select>
            </div>

            <!-- Select Product -->
            <div>
                <label class="text-xs font-semibold text-slate-600" x-text="labels[currentLang].addProduct"></label>
                <select x-model="selectedProductId" @change="addItemToSale()" class="w-full mt-1 p-2 border rounded-lg text-xs bg-slate-50">
                    <option value="" disabled selected>-- پروڈکٹ منتخب کریں --</option>
                    <template x-for="p in products" :key="p.id">
                        <option :value="p.id" x-text="p.name + ' (' + formatCurrency(p.price) + ')'"></option>
                    </template>
                </select>
            </div>

            <!-- Selected Items List -->
            <div class="space-y-2 border-t border-b py-2 my-2">
                <template x-for="(item, index) in newSale.items" :key="index">
                    <div class="flex items-center justify-between text-xs bg-slate-50 p-2 rounded">
                        <span class="font-semibold" x-text="item.name"></span>
                        <div class="flex items-center gap-2">
                            <input type="number" min="1" x-model.number="item.qty" class="w-12 p-1 border text-center rounded">
                            <span class="font-bold" x-text="formatCurrency(item.qty * item.price)"></span>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Summary & Submit -->
            <div class="flex justify-between items-center font-bold text-sm">
                <span>ٹوپیک کی کل رقم:</span>
                <span class="text-emerald-700 text-base" x-text="formatCurrency(calculateNewSaleTotal())"></span>
            </div>

            <button @click="submitSale()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-sm hover:bg-emerald-700 transition">
                محفوظ کریں (Save Sale)
            </button>
        </div>
    </div>

    <!-- APP STATE & LOGIC -->
    <script>
        function appData() {
            return {
                currentTab: 'dashboard',
                currentLang: 'ur',
                activeModal: null,
                selectedProductId: '',

                // Labels Dictionary for Multi-language support
                labels: {
                    ur: {
                        appName: 'فاروق چترالی آسان مارکیٹنگ',
                        tagline: 'چھوٹے کاروبار کا آسان ڈیجیٹل حساب',
                        today: 'آج',
                        todaySales: 'آج کی کل سیلز',
                        todayProfit: 'آج کا منافع',
                        todayExpenses: 'آج کے اخراجات',
                        receivables: 'کل واجب الوصول (اُدھار)',
                        stockValue: 'اسٹاک کی مالیت',
                        lowStockAlert: 'کم اسٹاک کی اطلاع',
                        recentSales: 'حالیہ فروخت',
                        salesHistory: 'سیلز کی تفصیل',
                        newSale: 'نئی سیل درج کریں',
                        inventory: 'اسٹاک / پروڈکٹس',
                        addProduct: 'نئی پروڈکٹ شامل کریں',
                        customerLedger: 'کسٹمر کھاتہ',
                        addCustomer: 'نیا کسٹمر',
                        reports: 'بزنس رپورٹس',
                        pnlSummary: 'نفع و نقصان خلاصہ',
                        totalRevenue: 'کل آمدنی',
                        cogs: 'سامان کی خرید لاگت',
                        netProfit: 'خالص منافع',
                        customer: 'کسٹمر',
                        b
