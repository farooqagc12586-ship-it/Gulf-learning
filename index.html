<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b6b4f">

<title>قرآن مجید — اردو ترجمہ و تلاوت</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6f4;
  color:#18231f;
  font-family:Arial,sans-serif;
}

header{
  background:linear-gradient(135deg,#063f30,#0b7658);
  color:white;
  padding:25px 15px;
  text-align:center;
  box-shadow:0 3px 15px #0002;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:8px 0 0;
  opacity:.9;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.mode-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.mode{
  border:0;
  padding:15px 8px;
  border-radius:12px;
  background:white;
  color:#07563f;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 2px 10px #0001;
}

.mode.active{
  background:#0b6b4f;
  color:white;
}

.controls{
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 2px 12px #0001;
  margin-bottom:15px;
}

.select-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

select,input{
  width:100%;
  padding:13px;
  border:1px solid #d5ddd9;
  border-radius:10px;
  font-size:15px;
  background:white;
}

.status{
  margin-top:10px;
  padding:10px;
  background:#edf7f3;
  color:#07563f;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.quran{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 2px 12px #0001;
}

.surah-title{
  text-align:center;
  border-bottom:1px solid #ddd;
  padding-bottom:15px;
  margin-bottom:15px;
}

.surah-title h2{
  margin:0 0 5px;
  color:#07563f;
}

.bismillah{
  font-size:28px;
  margin-top:10px;
}

.ayah{
  border-bottom:1px solid #e4e8e6;
  padding:22px 8px;
  cursor:pointer;
  transition:.2s;
}

.ayah.active{
  background:#edf8f4;
  border-radius:12px;
}

.ayah-number{
  display:inline-flex;
  width:34px;
  height:34px;
  border-radius:50%;
  align-items:center;
  justify-content:center;
  background:#0b6b4f;
  color:white;
  font-size:13px;
  margin-left:8px;
}

.arabic{
  font-family:"Times New Roman",serif;
  direction:rtl;
  text-align:right;
  font-size:31px;
  line-height:2.1;
  margin-bottom:12px;
}

.translation{
  direction:rtl;
  text-align:right;
  font-family:"Noto Naskh Arabic","Times New Roman",serif;
  font-size:20px;
  line-height:2;
  color:#3f4945;
}

.ruku{
  margin:15px 0;
  text-align:center;
  padding:8px;
  background:#f1f7f4;
  border-radius:8px;
  color:#087052;
  font-size:13px;
}

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#073f31;
  color:white;
  padding:10px;
  z-index:1000;
  box-shadow:0 -3px 15px #0003;
}

.player-inner{
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1.3fr 1fr;
  gap:8px;
  align-items:center;
}

.player button{
  border:0;
  border-radius:10px;
  padding:13px 5px;
  cursor:pointer;
  font-size:17px;
  font-weight:bold;
}

.prev{
  background:#dcebe5;
  color:#07563f;
}

.play{
  background:#ffffff;
  color:#07563f;
  font-size:20px !important;
}

.next{
  background:#dcebe5;
  color:#07563f;
}

.now-playing{
  text-align:center;
  font-size:12px;
  margin-bottom:7px;
  opacity:.9;
}

.loading{
  text-align:center;
  padding:30px;
  color:#087052;
}

.hidden{
  display:none !important;
}

@media(max-width:650px){

  header h1{
    font-size:24px;
  }

  .mode-box{
    grid-template-columns:1fr;
  }

  .select-row{
    grid-template-columns:1fr;
  }

  .arabic{
    font-size:27px;
  }

  .translation{
    font-size:18px;
  }

  .quran{
    padding:12px;
  }

  body{
    padding-bottom:90px;
  }
}

body{
  padding-bottom:90px;
}
</style>
</head>

<body>

<header>
  <h1>القرآن الكريم</h1>
  <p>تلاوتِ عبدالباسط عبدالصمد — ترجمۂ فتح محمد جالندھری</p>
</header>

<div class="container">

  <div class="mode-box">

    <button class="mode active" data-mode="both">
      قرآن بمع ترجمہ
    </button>

    <button class="mode" data-mode="quran">
      صرف قرآن تلاوت
    </button>

    <button class="mode" data-mode="urdu">
      صرف اردو ترجمہ
    </button>

  </div>

  <div class="controls">

    <div class="select-row">

      <select id="surahSelect">
        <option value="">سورت منتخب کریں</option>
      </select>

      <select id="ayahSelect">
        <option value="">آیت منتخب کریں</option>
      </select>

    </div>

    <div class="status" id="status">
      سورت منتخب کریں
    </div>

  </div>

  <div class="quran">

    <div id="content">
      <div class="loading">
        سورت منتخب کریں...
      </div>
    </div>

  </div>

</div>


<!-- AUDIO ELEMENTS -->

<audio id="arabicAudio" preload="auto"></audio>
<audio id="urduAudio" preload="auto"></audio>


<!-- PERMANENT PLAYER -->

<div class="player">

  <div class="now-playing" id="nowPlaying">
    کوئی آیت منتخب نہیں
  </div>

  <div class="player-inner">

    <!-- LEFT = PREVIOUS -->

    <button class="prev" id="prevBtn">
      ◀ پچھلی
    </button>

    <!-- CENTER = PLAY / PAUSE -->

    <button class="play" id="playBtn">
      ▶ چلائیں
    </button>

    <!-- RIGHT = NEXT -->

    <button class="next" id="nextBtn">
      اگلی ▶
    </button>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API = "https://api.alquran.cloud/v1";

const ARABIC_EDITION = "quran-uthmani";

/*
   Jalandhri edition
*/
const URDU_EDITION = "ur.jalandhry";

/*
   EveryAyah
*/
const ARABIC_AUDIO =
"https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/";

const URDU_AUDIO =
"https://everyayah.com/data/urdu_shamshad_ali_khan_46kbps/";


/* =====================================================
   GLOBAL STATE
===================================================== */

let mode = "both";

let currentSurah = null;

let currentAyah = 0;

let surahData = [];

let isPlaying = false;

let audioStage = "arabic";

let audioToken = 0;


/* =====================================================
   DOM
===================================================== */

const surahSelect =
document.getElementById("surahSelect");

const ayahSelect =
document.getElementById("ayahSelect");

const content =
document.getElementById("content");

const status =
document.getElementById("status");

const arabicAudio =
document.getElementById("arabicAudio");

const urduAudio =
document.getElementById("urduAudio");

const playBtn =
document.getElementById("playBtn");

const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");

const nowPlaying =
document.getElementById("nowPlaying");


/* =====================================================
   LOAD ALL 114 SURAHS
===================================================== */

async function loadSurahs(){

  try{

    status.textContent =
    "114 سورتوں کی فہرست لوڈ ہو رہی ہے...";

    const response =
    await fetch(`${API}/surah`);

    if(!response.ok)
      throw new Error("Surah API failed");

    const result =
    await response.json();

    const surahs =
    result.data;

    surahs.forEach(surah => {

      const option =
      document.createElement("option");

      option.value =
      surah.number;

      option.textContent =
      `${surah.number}. ${surah.name} — ${surah.englishName}`;

      surahSelect.appendChild(option);

    });

    status.textContent =
    "سورت منتخب کریں";

  }catch(error){

    console.error(error);

    status.textContent =
    "سورتوں کا ڈیٹا لوڈ نہیں ہو سکا۔ Internet چیک کریں۔";

  }

}


/* =====================================================
   LOAD SELECTED SURAH
===================================================== */

async function loadSurah(number){

  if(!number) return;

  stopAudio();

  content.innerHTML =
  `<div class="loading">سورت لوڈ ہو رہی ہے...</div>`;

  status.textContent =
  "قرآن اور اردو ترجمہ لوڈ ہو رہا ہے...";

  try{

    const url =
    `${API}/surah/${number}/editions/${ARABIC_EDITION},${URDU_EDITION}`;

    const response =
    await fetch(url);

    if(!response.ok)
      throw new Error("Quran API failed");

    const result =
    await response.json();

    const editions =
    result.data;

    const arabic =
    editions.find(
      x => x.edition.identifier === ARABIC_EDITION
    );

    const urdu =
    editions.find(
      x => x.edition.identifier === URDU_EDITION
    );

    if(!arabic)
      throw new Error("Arabic edition missing");

    if(!urdu)
      throw new Error("Urdu edition missing");

    currentSurah =
    arabic;

    surahData =
    arabic.ayahs.map((ayah,index) => {

      return {

        number:
        ayah.numberInSurah,

        global:
        ayah.number,

        arabic:
        ayah.text,

        urdu:
        urdu.ayahs[index]
        ? urdu.ayahs[index].text
        : "",

        ruku:
        ayah.ruku || null

      };

    });

    currentAyah = 0;

    renderSurah();

    buildAyahSelect();

    status.textContent =
    `${arabic.name} — ${surahData.length} آیات`;

    selectAyah(0,false);

  }catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="loading">
        <b>ڈیٹا لوڈ نہیں ہو سکا</b>
        <br><br>
        براہِ کرم Internet connection چیک کریں۔
      </div>
    `;

    status.textContent =
    "ڈیٹا لوڈ کرنے میں مسئلہ آیا۔";

  }

}


/* =====================================================
   RENDER SURAH
===================================================== */

function renderSurah(){

  if(!currentSurah) return;

  let html = `

    <div class="surah-title">

      <h2>
        ${currentSurah.name}
      </h2>

      <div>
        ${currentSurah.englishName}
      </div>

      <div class="bismillah">
        بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ
      </div>

    </div>

  `;

  let previousRuku = null;

  surahData.forEach((ayah,index)=>{

    if(
      ayah.ruku &&
      ayah.ruku !== previousRuku
    ){

      html += `
        <div class="ruku">
          رکوع ${ayah.ruku}
        </div>
      `;

      previousRuku =
      ayah.ruku;

    }

    html += `

      <div
        class="ayah"
        id="ayah-${index}"
        onclick="selectAyah(${index},true)"
      >

        <div
          class="arabic ${mode === "urdu" ? "hidden" : ""}"
        >

          <span class="ayah-number">
            ${ayah.number}
          </span>

          ${ayah.arabic}

        </div>

        <div
          class="translation ${mode === "quran" ? "hidden" : ""}"
        >

          ${ayah.urdu}

        </div>

      </div>

    `;

  });

  content.innerHTML = html;

}


/* =====================================================
   AYAH SELECT
===================================================== */

function buildAyahSelect(){

  ayahSelect.innerHTML =
  `<option value="">آیت منتخب کریں</option>`;

  surahData.forEach((ayah,index)=>{

    const option =
    document.createElement("option");

    option.value =
    index;

    option.textContent =
    `آیت ${ayah.number}`;

    ayahSelect.appendChild(option);

  });

}


/* =====================================================
   SELECT AYAH
===================================================== */

function selectAyah(index,manual=true){

  if(!surahData.length)
    return;

  if(index < 0)
    index = 0;

  if(index >= surahData.length)
    index = surahData.length - 1;

  currentAyah =
  index;

  ayahSelect.value =
  index;

  document
  .querySelectorAll(".ayah")
  .forEach(x =>
    x.classList.remove("active")
  );

  const element =
  document.getElementById(`ayah-${index}`);

  if(element){

    element.classList.add("active");

    element.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

  const ayah =
  surahData[index];

  nowPlaying.textContent =
  `${currentSurah.name} — آیت ${ayah.number}`;

  if(manual){

    playCurrent();

  }

}


/* =====================================================
   AUDIO URL
===================================================== */

function audioFile(surah,ayah){

  const s =
  String(surah).padStart(3,"0");

  const a =
  String(ayah).padStart(3,"0");

  return `${s}${a}.mp3`;

}


/* =====================================================
   PLAY CURRENT AYAH
===================================================== */

async function playCurrent(){

  if(!surahData.length)
    return;

  const ayah =
  surahData[currentAyah];

  audioToken++;

  const token =
  audioToken;

  stopAudioOnly();

  isPlaying = true;

  updatePlayButton();

  selectAyah(currentAyah,false);

  /*
    ONLY QURAN
  */

  if(mode === "quran"){

    audioStage =
    "arabic";

    await playArabic(ayah,token);

    return;

  }


  /*
    ONLY URDU
  */

  if(mode === "urdu"){

    audioStage =
    "urdu";

    await playUrdu(ayah,token);

    return;

  }


  /*
    QURAN + URDU
  */

  audioStage =
  "arabic";

  await playArabic(ayah,token);

}


/* =====================================================
   ARABIC AUDIO
===================================================== */

function playArabic(ayah,token){

  return new Promise(resolve=>{

    if(token !== audioToken){
      resolve();
      return;
    }

    const file =
    audioFile(
      currentSurah.number,
      ayah.number
    );

    arabicAudio.src =
    ARABIC_AUDIO + file;

    arabicAudio.currentTime =
    0;

    urduAudio.pause();

    arabicAudio.play()
    .then(()=>{

      isPlaying = true;

      updatePlayButton();

      resolve();

    })
    .catch(error=>{

      console.error(error);

      isPlaying = false;

      updatePlayButton();

      resolve();

    });

  });

}


/* =====================================================
   URDU AUDIO
===================================================== */

function playUrdu(ayah,token){

  return new Promise(resolve=>{

    if(token !== audioToken){
      resolve();
      return;
    }

    const file =
    audioFile(
      currentSurah.number,
      ayah.number
    );

    urduAudio.src =
    URDU_AUDIO + file;

    urduAudio.currentTime =
    0;

    arabicAudio.pause();

    urduAudio.play()
    .then(()=>{

      isPlaying = true;

      updatePlayButton();

      resolve();

    })
    .catch(error=>{

      console.error(error);

      isPlaying = false;

      updatePlayButton();

      resolve();

    });

  });

}


/* =====================================================
   WHEN ARABIC ENDS
===================================================== */

arabicAudio.addEventListener(
"ended",
async ()=>{

  if(!isPlaying)
    return;

  /*
    BOTH MODE:
    Arabic -> Urdu
  */

  if(mode === "both"){

    audioStage =
    "urdu";

    await playUrdu(
      surahData[currentAyah],
      audioToken
    );

    return;

  }

  /*
    QURAN ONLY:
    next ayah
  */

  if(mode === "quran"){

    goNextAutomatically();

  }

});


/* =====================================================
   WHEN URDU ENDS
===================================================== */

urduAudio.addEventListener(
"ended",
()=>{

  if(!isPlaying)
    return;

  /*
    Urdu-only or Both:
    next ayah
  */

  if(
    mode === "urdu" ||
    mode === "both"
  ){

    goNextAutomatically();

  }

});


/* =====================================================
   AUTO NEXT AYAH
===================================================== */

function goNextAutomatically(){

  if(currentAyah <
     surahData.length - 1){

    currentAyah++;

    selectAyah(
      currentAyah,
      false
    );

    setTimeout(
      ()=>playCurrent(),
      150
    );

    return;

  }


  /*
    SURAH FINISHED
  */

  isPlaying = false;

  updatePlayButton();

  nowPlaying.textContent =
  `${currentSurah.name} مکمل ہو گئی`;

}


/* =====================================================
   NEXT BUTTON
===================================================== */

nextBtn.addEventListener(
"click",
()=>{

  if(!surahData.length)
    return;

  if(
    currentAyah <
    surahData.length - 1
  ){

    currentAyah++;

    selectAyah(
      currentAyah,
      true
    );

  }

});


/* =====================================================
   PREVIOUS BUTTON
===================================================== */

prevBtn.addEventListener(
"click",
()=>{

  if(!surahData.length)
    return;

  if(currentAyah > 0){

    currentAyah--;

    selectAyah(
      currentAyah,
      true
    );

  }

});


/* =====================================================
   PLAY / PAUSE
===================================================== */

playBtn.addEventListener(
"click",
()=>{

  if(!surahData.length)
    return;

  /*
    Currently playing
  */

  if(isPlaying){

    arabicAudio.pause();

    urduAudio.pause();

    isPlaying = false;

    updatePlayButton();

    return;

  }


  /*
    Resume existing audio
  */

  const audio =
  audioStage === "urdu"
  ? urduAudio
  : arabicAudio;

  if(audio.src && audio.currentTime > 0){

    audio.play()
    .then(()=>{

      isPlaying = true;

      updatePlayButton();

    })
    .catch(()=>{

      playCurrent();

    });

    return;

  }

  playCurrent();

});


/* =====================================================
   UPDATE PLAY BUTTON
===================================================== */

function updatePlayButton(){

  playBtn.textContent =
  isPlaying
  ? "⏸ روکیں"
  : "▶ چلائیں";

}


/* =====================================================
   STOP AUDIO
===================================================== */

function stopAudioOnly(){

  arabicAudio.pause();

  urduAudio.pause();

}


function stopAudio(){

  audioToken++;

  stopAudioOnly();

  arabicAudio.removeAttribute("src");

  urduAudio.removeAttribute("src");

  isPlaying = false;

  updatePlayButton();

}


/* =====================================================
   MODE SWITCH
===================================================== */

document
.querySelectorAll(".mode")
.forEach(button=>{

  button.addEventListener(
  "click",
  ()=>{

    document
    .querySelectorAll(".mode")
    .forEach(x =>
      x.classList.remove("active")
    );

    button.classList.add("active");

    mode =
    button.dataset.mode;

    renderSurah();

    if(surahData.length){

      selectAyah(
        currentAyah,
        false
      );

    }

    stopAudio();

  });

});


/* =====================================================
   SURAH SELECT
===================================================== */

surahSelect.addEventListener(
"change",
()=>{

  const number =
  Number(surahSelect.value);

  if(number){

    loadSurah(number);

  }

});


/* =====================================================
   AYAH SELECT
===================================================== */

ayahSelect.addEventListener(
"change",
()=>{

  if(
    ayahSelect.value === ""
  )
    return;

  selectAyah(
    Number(ayahSelect.value),
    true
  );

});


/* =====================================================
   KEYBOARD CONTROLS
===================================================== */

document.addEventListener(
"keydown",
event=>{

  /*
    Space = Play/Pause
  */

  if(event.code === "Space"){

    event.preventDefault();

    playBtn.click();

  }

  /*
    ArrowRight = next
  */

  if(event.key === "ArrowRight"){

    nextBtn.click();

  }

  /*
    ArrowLeft = previous
  */

  if(event.key === "ArrowLeft"){

    prevBtn.click();

  }

});


/* =====================================================
   START APP
===================================================== */

loadSurahs();

</script>

</body>
</html>
