<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - المكتبة الرقمية</title>
    
    <!-- Scheherazade New (Bold) & Noto Nastaliq Urdu Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-emerald: #0e3b2e;
            --accent-gold: #d4af37;
            --light-gold: #f4e8c1;
            --bg-cream: #faf8f5;
            --card-white: #ffffff;
            --text-dark: #1f2937;
        }

        body {
            font-family: 'Noto Nastaliq Urdu', 'Scheherazade New', serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header Banner */
        .header-banner {
            background: linear-gradient(135deg, #0e3b2e 0%, #175241 100%);
            color: var(--accent-gold);
            text-align: center;
            padding: 25px 15px;
            border-radius: 16px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 10px 25px rgba(14, 59, 46, 0.15);
            margin-bottom: 20px;
        }

        .header-banner h1 {
            font-family: 'Scheherazade New', serif;
            font-size: 34px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header-banner p {
            color: #e0e0e0;
            font-size: 14px;
            margin: 8px 0 0 0;
        }

        /* Controls Card */
        .controls-card {
            background: var(--card-white);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            color: var(--primary-emerald);
            font-weight: bold;
        }

        select, input {
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent-gold);
        }

        .btn-load {
            background: linear-gradient(135deg, #0e3b2e 0%, #175241 100%);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 11px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(14, 59, 46, 0.2);
        }

        .btn-load:hover {
            background: var(--accent-gold);
            color: var(--primary-emerald);
        }

        /* Sticky Bottom Audio Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 900px;
            background: var(--primary-emerald);
            border: 1px solid var(--accent-gold);
            border-bottom: none;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            box-shadow: 0 -6px 25px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
        }

        .player-status {
            font-size: 14px;
            color: var(--light-gold);
        }

        .player-controls {
            display: flex;
            gap: 8px;
        }

        .player-controls button {
            background: var(--accent-gold);
            color: var(--primary-emerald);
            border: none;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .player-controls button:hover {
            background: #ffffff;
        }

        /* Ayah Cards */
        .ayah-card {
            background: var(--card-white);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 16px;
            border: 1px solid #eaeaea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            position: relative;
        }

        .ayah-card.playing {
            border: 2px solid var(--accent-gold);
            background-color: #fcf9f2;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        .meta-tag {
            font-size: 12px;
            color: var(--primary-emerald);
            background: var(--light-gold);
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .arabic {
            font-family: 'Scheherazade New', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-emerald);
            line-height: 2.2;
            text-align: right;
            margin-bottom: 14px;
        }

        .urdu {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 18px;
            color: #334155;
            line-height: 2.2;
            text-align: right;
            border-top: 1px dashed #e2e8f0;
            padding-top: 12px;
        }

        .play-btn-small {
            margin-top: 12px;
            font-size: 12px;
            padding: 5px 12px;
            background: transparent;
            color: var(--primary-emerald);
            border: 1px solid var(--primary-emerald);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .play-btn-small:hover {
            background: var(--primary-emerald);
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header-banner">
        <h1>القرآن الكريم</h1>
        <p>تلاوت: قاری عبد الباسط عبد الصمد • اردو ترجمہ صوتی: شمشاد علی خان</p>
    </div>

    <!-- Controls -->
    <div class="controls-card">
        <div class="control-group">
            <label>انتخاب کا طریقہ:</label>
            <select id="modeSelect" onchange="handleModeChange()">
                <option value="surah">سورۃ وائز (رکوع)</option>
                <option value="juz">پارہ وائز</option>
                <option value="ayah">آیت وائز</option>
            </select>
        </div>

        <div class="control-group">
            <label id="selectionLabel">سورۃ منتخب کریں:</label>
            <select id="itemSelect" onchange="handleItemChange()"></select>
        </div>

        <!-- Dynamic Ruku Dropdown -->
        <div class="control-group" id="rukuBox">
            <label>رکوع منتخب کریں:</label>
            <select id="rukuSelect"></select>
        </div>

        <div class="control-group" id="ayahBox" style="display: none;">
            <label>آیت نمبر:</label>
            <input type="number" id="ayahInput" value="1" min="1">
        </div>

        <div class="control-group">
            <label>آڈیو آپشن:</label>
            <select id="audioOption">
                <option value="both">تلاوت + اردو ترجمہ</option>
                <option value="arabic">صرف عربی تلاوت</option>
                <option value="urdu">صرف اردو ترجمہ</option>
            </select>
        </div>

        <button class="btn-load" onclick="loadContent()">لوڈ کریں</button>
    </div>

    <!-- Fixed Bottom Audio Player Bar -->
    <div class="player-bar">
        <div class="player-status" id="playerStatus">حالت: تیار ہے</div>
        <div class="player-controls">
            <button onclick="playAll()">پلے کریں ▶</button>
            <button onclick="pauseAudio()">روکیں ⏸</button>
        </div>
    </div>

    <!-- Quran Content -->
    <div id="quranContainer">
        <p style="text-align:center; color: #64748b; margin-top: 30px;">براہِ کرم اپنی پسند کے مطابق آپشن منتخب کر کے "لوڈ کریں" پر کلک کریں۔</p>
    </div>
</div>

<audio id="globalAudioPlayer"></audio>

<script>
    const SURAHS = [
        "1. الفاتحة", "2. البقرة", "3. آل عمران", "4. النساء", "5. المائدة", "6. الأنعام", "7. الأعراف", "8. الأنفال", "9. التوبة", "10. يونس",
        "11. هود", "12. يوسف", "13. الرعد", "14. إبراهيم", "15. الحجر", "16. النحل", "17. الإسراء", "18. الكهف", "19. مريم", "20. طه",
        "21. الأنبياء", "22. الحج", "23. المؤمنون", "24. النور", "25. الفرقان", "26. الشعراء", "27. النمل", "28. القصص", "29. العنكبوت", "30. الروم",
        "31. لقمان", "32. السجدة", "33. الأحزاب", "34. سبأ", "35. فاطر", "36. يس", "37. الصافات", "38. ص", "39. الزمر", "40. غافر",
        "41. فصلت", "42. الشورى", "43. الزخرف", "44. الدخان", "45. الجاثية", "46. الأحقاف", "47. محمد", "48. الفتح", "49. الحجرات", "50. ق",
        "51. الذاريات", "52. الطور", "53. النجم", "54. القمر", "55. الرحمن", "56. الواقعة", "57. الحديد", "58. المجادلة", "59. الحشر", "60. الممتحنة",
        "61. الصف", "62. الجمعة", "63. المنافقون", "64. التغابن", "65. الطلاق", "66. التحريم", "67. الملك", "68. القلم", "69. الحاقة", "70. المعارج",
        "71. نوح", "72. الجن", "73. المزمل", "74. المدثر", "75. القيامة", "76. الإنسان", "77. المرسلات", "78. النبأ", "79. النازعات", "80. عبس",
        "81. التكوير", "82. الانفطار", "83. المطففين", "84. الانشقاق", "85. البروج", "86. الطارق", "87. الأعلى", "88. الغاشية", "89. الفجر", "90. البلد",
        "91. الشمس", "92. الليل", "93. الضحى", "94. الشرح", "95. التين", "96. العلق", "97. القدر", "98. البينة", "99. الزلزلة", "100. العاديات",
        "101. القارعة", "102. التكاثر", "103. العصر", "104. الهمزة", "105. الفيل", "106. قريش", "107. الماعون", "108. الكوثر", "109. الكافرون", "110. النصر",
        "111. المسد", "112. الإخلاص", "113. الفلق", "114. الناس"
    ];

    let currentPlaylist = [];
    let currentTrackIndex = 0;
    let isArabicTurn = true;
    let isPlayingMode = false;

    const audioPlayer = document.getElementById('globalAudioPlayer');

    function populateSurahs() {
        const select = document.getElementById('itemSelect');
        select.innerHTML = '';
        SURAHS.forEach((name, index) => {
            let opt = document.createElement('option');
            opt.value = index + 1;
            opt.textContent = name;
            select.appendChild(opt);
        });
    }

    function populateJuzs() {
        const select = document.getElementById('itemSelect');
        select.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `پارہ نمبر ${i}`;
            select.appendChild(opt);
        }
    }

    async function handleItemChange() {
        const mode = document.getElementById('modeSelect').value;
        const surahId = document.getElementById('itemSelect').value;
        const rukuSelect = document.getElementById('rukuSelect');

        if (mode !== 'surah' || !surahId) return;

        rukuSelect.innerHTML = '<option>رکوع لوڈ ہو رہے ہیں...</option>';

        try {
            // سورت کے رکوع معلوم کرنے کے لیے ہلکی ترین API کال
            const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}`);
            const data = await res.json();
            
            const ayahs = data.data.ayahs;
            const rukuSet = [...new Set(ayahs.map(a => a.ruku))];

            rukuSelect.innerHTML = '';

            if (rukuSet.length > 1) {
                rukuSet.forEach((rukuGlobalId, index) => {
                    let opt = document.createElement('option');
                    opt.value = rukuGlobalId;
                    opt.textContent = `رکوع ${index + 1}`;
                    rukuSelect.appendChild(opt);
                });
                
                // ایک آپشن مکمل سورت کا بھی رکھ دیا ہے
                let allOpt = document.createElement('option');
                allOpt.value = 'all';
                allOpt.textContent = 'مکمل سورۃ (تمام رکوع)';
                rukuSelect.appendChild(allOpt);
            } else {
                let opt = document.createElement('option');
                opt.value = rukuSet[0];
                opt.textContent = 'مکمل سورۃ (رکوع 1)';
                rukuSelect.appendChild(opt);
            }
        } catch (e) {
            rukuSelect.innerHTML = '<option value="all">تمام رکوع</option>';
        }
    }

    function handleModeChange() {
        const mode = document.getElementById('modeSelect').value;
        const label = document.getElementById('selectionLabel');
        const ayahBox = document.getElementById('ayahBox');
        const rukuBox = document.getElementById('rukuBox');

        if (mode === 'surah') {
            label.textContent = 'سورۃ منتخب کریں:';
            ayahBox.style.display = 'none';
            rukuBox.style.display = 'flex';
            populateSurahs();
            handleItemChange();
        } else if (mode === 'juz') {
            label.textContent = 'پارہ منتخب کریں:';
            ayahBox.style.display = 'none';
            rukuBox.style.display = 'none';
            populateJuzs();
        } else if (mode === 'ayah') {
            label.textContent = 'سورۃ:';
            ayahBox.style.display = 'flex';
            rukuBox.style.display = 'none';
            populateSurahs();
        }
    }

    async function loadContent() {
        pauseAudio();
        const mode = document.getElementById('modeSelect').value;
        const selectedVal = document.getElementById('itemSelect').value;
        const rukuVal = document.getElementById('rukuSelect').value;
        const container = document.getElementById('quranContainer');

        if (!selectedVal) return;

        container.innerHTML = '<p style="text-align:center; color:#0e3b2e; font-weight:bold;">لوڈ ہو رہا ہے... براہِ کرم انتظار کریں۔</p>';

        let url = '';
        if (mode === 'surah') {
            if (rukuVal && rukuVal !== 'all') {
                // صرف منتخب رکوع لوڈ ہوگا
                url = `https://api.alquran.cloud/v1/ruku/${rukuVal}/editions/ar.abdulbasitmurattal,ur.jalandhry,ur.khan`;
            } else {
                // مکمل سورت
                url = `https://api.alquran.cloud/v1/surah/${selectedVal}/editions/ar.abdulbasitmurattal,ur.jalandhry,ur.khan`;
            }
        } else if (mode === 'juz') {
            url = `https://api.alquran.cloud/v1/juz/${selectedVal}/editions/ar.abdulbasitmurattal,ur.jalandhry,ur.khan`;
        } else if (mode === 'ayah') {
            const ayahNo = document.getElementById('ayahInput').value || 1;
            url = `https://api.alquran.cloud/v1/ayah/${selectedVal}:${ayahNo}/editions/ar.abdulbasitmurattal,ur.jalandhry,ur.khan`;
        }

        try {
            const res = await fetch(url);
            const data = await res.json();

            let arAyahs = [], urTextAyahs = [], urAudioAyahs = [];

            if (mode === 'ayah') {
                arAyahs = [data.data[0]];
                urTextAyahs = [data.data[1]];
                urAudioAyahs = [data.data[2]];
            } else {
                arAyahs = data.data[0].ayahs;
                urTextAyahs = data.data[1].ayahs;
                urAudioAyahs = data.data[2].ayahs;
            }

            currentPlaylist = [];
            let html = '';

            for (let i = 0; i < arAyahs.length; i++) {
                const item = {
                    index: i,
                    surahName: arAyahs[i].surah ? arAyahs[i].surah.name : '',
                    ayahNo: arAyahs[i].numberInSurah,
                    arabicText: arAyahs[i].text,
                    urduText: urTextAyahs[i].text,
                    arabicAudio: arAyahs[i].audio,
                    urduAudio: urAudioAyahs[i].audio
                };
                currentPlaylist.push(item);

                html += `
                    <div class="ayah-card" id="card-${i}">
                        <span class="meta-tag">آیت: ${item.ayahNo} ${item.surahName ? '| سورۃ ' + item.surahName : ''}</span>
                        <div class="arabic">${item.arabicText} ﴿${item.ayahNo}﴾</div>
                        <div class="urdu">${item.urduText}</div>
                        <button class="play-btn-small" onclick="playSingleAyah(${i})">یہ آیت سنیں ▶</button>
                    </div>
                `;
            }

            container.innerHTML = html;
            document.getElementById('playerStatus').textContent = `کُل آیات: ${currentPlaylist.length} | تیار ہے`;
            currentTrackIndex = 0;

        } catch (e) {
            container.innerHTML = '<p style="color:red; text-align:center;">ڈیٹا لوڈ کرنے میں مسئلہ آیا ہے۔ انٹرنیٹ چیک کر کے دوبارہ کوشش کریں۔</p>';
            console.error(e);
        }
    }

    function playAll() {
        if (currentPlaylist.length === 0) {
            alert("پہلے 'لوڈ کریں' کا بٹن دبا کر سورت یا پارہ لوڈ کریں۔");
            return;
        }
        isPlayingMode = true;
        isArabicTurn = true;
        playTrack();
    }

    function playSingleAyah(index) {
        currentTrackIndex = index;
        isPlayingMode = true;
        isArabicTurn = true;
        playTrack();
    }

    function playTrack() {
        if (currentTrackIndex >= currentPlaylist.length) {
            document.getElementById('playerStatus').textContent = "مکمل ہو گیا";
            clearHighlights();
            isPlayingMode = false;
            return;
        }

        const audioOpt = document.getElementById('audioOption').value;
        const currentItem = currentPlaylist[currentTrackIndex];

        highlightCard(currentTrackIndex);

        if (audioOpt === 'both') {
            if (isArabicTurn) {
                document.getElementById('playerStatus').textContent = `پلے ہو رہا ہے: آیت ${currentItem.ayahNo} (عربی تلاوت)`;
                audioPlayer.src = currentItem.arabicAudio;
            } else {
                document.getElementById('playerStatus').textContent = `پلے ہو رہا ہے: آیت ${currentItem.ayahNo} (اردو ترجمہ)`;
                audioPlayer.src = currentItem.urduAudio;
            }
        } else if (audioOpt === 'arabic') {
            document.getElementById('playerStatus').textContent = `پلے ہو رہا ہے: آیت ${currentItem.ayahNo} (عربی تلاوت)`;
            audioPlayer.src = currentItem.arabicAudio;
        } else if (audioOpt === 'urdu') {
            document.getElementById('playerStatus').textContent = `پلے ہو رہا ہے: آیت ${currentItem.ayahNo} (اردو ترجمہ)`;
            audioPlayer.src = currentItem.urduAudio;
        }

        audioPlayer.play().catch(err => console.error(err));
    }

    audioPlayer.onended = function() {
        if (!isPlayingMode) return;

        const audioOpt = document.getElementById('audioOption').value;

        if (audioOpt === 'both') {
            if (isArabicTurn) {
                isArabicTurn = false;
                playTrack();
            } else {
                isArabicTurn = true;
                curr
