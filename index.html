<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <title>10 Questions Online Exam</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; direction: rtl; }
    fieldset { margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; }
    legend { font-weight: bold; padding: 0 10px; }
    button { padding: 10px 20px; background: green; color: white; border: none; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

  <h2>آن لائن امتحان (10 سوالات)</h2>
  
  <form id="quizForm">
    <input type="text" name="studentName" placeholder="آپ کا نام" required><br><br>
    <input type="email" name="studentEmail" placeholder="آپ کا جیمیل (Gmail)" required><br><br>

    <!-- Q1 -->
    <fieldset>
      <legend>1. He ---- to school everyday.</legend>
      <input type="radio" name="q1" value="a"> goes <br>
      <input type="radio" name="q1" value="b"> go <br>
    </fieldset>

    <!-- Q2 -->
    <fieldset>
      <legend>2. They ---- playing football.</legend>
      <input type="radio" name="q2" value="a"> is <br>
      <input type="radio" name="q2" value="b"> are <br>
    </fieldset>

    <!-- Q3 se Q10 tak isi tarah q3, q4... q10 banayein -->

    <button type="button" onclick="submitPaper()">امتحان جمع کروائیں</button>
  </form>

  <h3 id="statusMessage"></h3>

  <script>
    function submitPaper() {
      const form = document.getElementById('quizForm');
      const formData = new FormData(form);
      
      document.getElementById("statusMessage").innerText = "پیپر جمع ہو رہا ہے، براہ کرم انتظار کریں...";

      // AKfycbzUfPO4W3_IbFD192vc4K0kPUyCzUAH-zlGC9CvYe7KrdVZ6qTEErq-Opldyc0gjwAN
      const scriptURL = 'https://script.google.com/macros/s/AKfycbzUfPO4W3_IbFD192vc4K0kPUyCzUAH-zlGC9CvYe7KrdVZ6qTEErq-Opldyc0gjwAN/exec';

      fetch(scriptURL, { method: 'POST', body: formData})
        .then(response => {
          document.getElementById("statusMessage").innerText = "شکریہ! آپ کا امتحان جمع ہو چکا ہے۔ نتیجہ نوٹس بورڈ پر جاری کیا جائے گا۔";
          form.reset();
        })
        .catch(error => console.error('Error!', error.message));
    }
  </script>
</body>
</html>
