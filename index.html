<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071c17">

<title>القرآن الكريم — قرآن و اردو ترجمہ</title>

<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

<style>
@font-face{
    font-family:"QuranFont";
    src:url("https://fonts.quran.com/uthmanic_hafs/v20/UthmanicHafs.woff2")
    format("woff2");
    font-display:swap;
}

:root{
    --bg:#06130f;
    --panel:#0d211b;
    --panel2:#102a22;
    --border:#2c5547;
    --gold:#d7b45a;
    --gold2:#f0d477;
    --white:#f7f4eb;
    --muted:#a9bbb3;

    --arabic:
        "QuranFont",
        "KFGQPC Uthman Taha Naskh Regular",
        serif;

    --urdu:
        "Scheherazade New",
        "Jameel Noori Nastaleeq",
        serif;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#153d31 0,#06130f 45%,#020806 100%);
    color:var(--white);
    font-family:var(--urdu);
    padding-bottom:155px;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:50;
    text-align:center;
    padding:18px 12px;
    background:#04110def;
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--gold);
}

header h1{
    margin:0;
    color:var(--gold2);
    font-family:var(--arabic);
    font-size:clamp(2rem,6vw,3.5rem);
}

header p{
    margin:4px 0 0;
    color:var(--muted);
    font-size:1rem;
}

/* CONTAINER */

.container{
    width:min(1200px,94%);
    margin:auto;
}

/* MODES */

.modes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:18px 0;
}

.mode{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--white);
    padding:13px 8px;
    border-radius:14px;
    cursor:pointer;
    font-size:1.05rem;
}

.mode.active{
    background:linear-gradient(135deg,#e0bd61,#987128);
    color:#07110d;
    font-weight:bold;
}

/* SEARCH */

.search{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.search input{
    flex:1;
    min-width:0;
    padding:13px 15px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#071a15;
    color:white;
    font-family:var(--urdu);
    font-size:1rem;
}

.search button{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--gold2);
    border-radius:12px;
    padding:0 17px;
    cursor:pointer;
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:18px;
    align-items:start;
}

/* SIDEBAR */

.sidebar{
    background:linear-gradient(180deg,#0e2921,#091b16);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
    position:sticky;
    top:115px;
    max-height:calc(100vh - 130px);
    overflow-y:auto;
}

.title{
    color:var(--gold2);
    font-size:1.35rem;
    border-bottom:1px solid var(--border);
    padding-bottom:8px;
    margin:5px 0 12px;
    text-align:center;
}

.surah{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    text-align:right;

    background:#0a1e18;
    color:white;

    border:1px solid transparent;
    border-radius:11px;

    padding:10px;
    margin:5px 0;

    cursor:pointer;
}

.surah:hover,
.surah.active{
    border-color:var(--gold);
    background:#17382d;
}

.surah-name{
    font-family:var(--arabic);
    font-size:1.3rem;
}

.badge{
    background:var(--gold);
    color:#07120e;
    border-radius:30px;
    padding:2px 8px;
    font-size:.78rem;
    white-space:nowrap;
}

/* RUKU */

.ruku-container{
    display:none;
    border-right:2px solid #356052;
    padding-right:8px;
    margin-right:5px;
}

.ruku-container.open{
    display:block;
}

.ruku{
    width:100%;
    border:1px solid #244a3e;
    background:#071914;
    color:white;
    padding:8px;
    border-radius:8px;
    margin:4px 0;
    cursor:pointer;
}

/* READER */

.reader{
    background:linear-gradient(180deg,#0e2921,#091b16);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
}

.surah-header{
    text-align:center;
    border-bottom:1px solid var(--border);
    padding-bottom:14px;
    margin-bottom:15px;
}

.surah-header h2{
    margin:0;
    font-family:var(--arabic);
    color:var(--gold2);
    font-size:2.2rem;
}

.surah-header p{
    color:var(--muted);
    margin:4px;
}

/* AYAH */

.ayah{
    background:#091c17;
    border:1px solid #193c31;
    border-radius:15px;
    padding:20px;
    margin:13px 0;
    transition:.25s;
}

.ayah.playing{
    border-color:var(--gold);
    box-shadow:
        0 0 0 1px #d7b45a33,
        0 10px 30px #0008;
}

.ayah-number{
    color:var(--gold);
    font-size:.95rem;
    margin-bottom:8px;
}

.arabic{
    font-family:var(--arabic);
    font-size:clamp(2rem,4vw,3rem);
    line-height:2.25;
    text-align:right;
}

.urdu{
    font-family:var(--urdu);
    font-size:clamp(1.4rem,2.7vw,1.8rem);
    line-height:1.9;
    color:#e4ddd1;
    border-top:1px dashed #315247;
    margin-top:12px;
    padding-top:10px;
}

.hidden{
    display:none!important;
}

/* AYAH PLAY */

.ayah-play{
    margin-top:10px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--gold);
    background:var(--panel2);
    color:var(--gold2);
    cursor:pointer;
}

/* PLAYER */

.player{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:100;

    background:#03100cf7;
    backdrop-filter:blur(18px);

    border-top:2px solid var(--gold);

    box-shadow:0 -12px 40px #000b;

    padding:
        10px
        15px
        calc(10px + env(safe-area-inset-bottom));
}

.player-info{
    text-align:center;
    color:var(--gold2);
    min-height:24px;
}

.controls{
    display:flex;
    direction:ltr;
    justify-content:center;
    align-items:center;
    gap:25px;
    margin:6px 0;
}

/*
 LEFT  = FORWARD
 CENTER= PLAY / PAUSE
 RIGHT = REVERSE
*/

.control{
    width:53px;
    height:53px;
    border-radius:50%;
    border:1px solid var(--gold);
    background:#0c241c;
    color:var(--gold2);
    cursor:pointer;
    font-size:1.1rem;
}

.control.main{
    width:68px;
    height:68px;
    background:var(--gold);
    color:#06130f;
    font-size:1.5rem;
}

.status{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
}

/* DOWNLOAD */

.download-panel{
    margin:10px 0 20px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#081a15;
}

.download-button{
    width:100%;
    padding:11px;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold2);
    border-radius:10px;
    cursor:pointer;
}

.progress{
    width:100%;
    height:7px;
    background:#17362c;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.progress-bar{
    width:0%;
    height:100%;
    background:var(--gold);
    transition:.2s;
}

/* LOADING */

.loading{
    text-align:center;
    padding:50px;
    color:var(--gold2);
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:50px 15px;
}

/* MOBILE */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:static;
        max-height:none;
    }

    .modes{
        grid-template-columns:1fr;
    }

    .reader{
        padding:12px;
    }

    .controls{
        gap:20px;
    }
}
</style>
</head>

<body>

<header>

<h1>القرآن الكريم</h1>

<p>
تلاوت: عبدالباسط عبدالصمد
|
اردو ترجمہ: شمشاد علی خان
|
ترجمہ: فتح محمد جالندھری
</p>

</header>


<main class="container">


<!-- MODES -->

<div class="modes">

<button class="mode active" data-mode="both">
① قرآن بمع ترجمہ
</button>

<button class="mode" data-mode="arabic">
② صرف قرآن تلاوت
</button>

<button class="mode" data-mode="urdu">
③ صرف اردو ترجمہ
</button>

</div>


<!-- SEARCH -->

<div class="search">

<input
id="search"
type="search"
placeholder="سورت تلاش کریں..."
>

<button onclick="topPage()">
⌂
</button>

</div>


<div class="layout">


<!-- SIDEBAR -->

<aside class="sidebar">

<h2 class="title">
سورتوں کی فہرست
</h2>

<div id="surahList">

<div class="loading">
سورتیں لوڈ ہو رہی ہیں...
</div>

</div>

</aside>


<!-- READER -->

<section class="reader">

<div id="reader">

<div class="empty">

<div
style="
font-family:var(--arabic);
font-size:2.5rem;
color:var(--gold2);
"
>
بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ
</div>

<p>
سورت منتخب کریں
</p>

</div>

</div>

</section>

</div>

</main>


<!-- PERMANENT PLAYER -->

<div class="player">

<div class="player-info" id="playerInfo">
کوئی آیت منتخب نہیں
</div>


<div class="controls">

<!-- LEFT = FORWARD -->

<button
class="control"
id="nextButton"
title="آگے"
>
▶|
</button>


<!-- CENTER = PLAY / PAUSE -->

<button
class="control main"
id="playButton"
title="Play / Pause"
>
▶
</button>


<!-- RIGHT = REVERSE -->

<button
class="control"
id="previousButton"
title="پیچھے"
>
|◀
</button>

</div>


<div
class="status"
id="audioStatus"
>
تیار
</div>

</div>


<script>

/*
==================================================
QURAN APPLICATION ENGINE
==================================================
*/

const API =
"https://api.alquran.cloud/v1";


const AUDIO_AR =
"https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/";


const AUDIO_UR =
"https://everyayah.com/data/urdu_shamshad_ali_khan_46kbps/";


let mode="both";

let surahs=[];

let currentSurah=null;

let verses=[];

let currentIndex=0;

let translationTurn=false;

let playing=false;


const audio=new Audio();

audio.preload="auto";


/*
==================================================
HELPERS
==================================================
*/

function $(id){

    return document.getElementById(id);

}


function audioFile(surah,ayah){

    return String(surah).padStart(3,"0")
        +
        String(ayah).padStart(3,"0")
        +
        ".mp3";

}


function arabicAudio(surah,ayah){

    return AUDIO_AR+
        audioFile(surah,ayah);

}


function urduAudio(surah,ayah){

    return AUDIO_UR+
        audioFile(surah,ayah);

}


/*
==================================================
LOAD 114 SURAHS
==================================================
*/

async function loadSurahs(){

    try{

        const response=
            await fetch(
                API+"/surah"
            );

        const json=
            await response.json();

        surahs=json.data;

        renderSurahs();

    }

    catch(error){

        $("surahList").innerHTML=
        `
        <div class="empty">
        سورتوں کا ڈیٹا لوڈ نہیں ہو سکا۔
        </div>
        `;

        console.error(error);

    }

}


/*
==================================================
SURAH LIST
==================================================
*/

function renderSurahs(filter=""){

    const list=$("surahList");

    list.innerHTML="";

    const filtered=
        surahs.filter(s=>
            s.name.includes(filter)
            ||
            s.englishName.toLowerCase()
                .includes(filter.toLowerCase())
            ||
            String(s.number).includes(filter)
        );


    filtered.forEach(s=>{

        const wrapper=
            document.createElement("div");


        const button=
            document.createElement("button");

        button.className="surah";


        button.innerHTML=`

            <span class="surah-name">
                ${s.name}
            </span>

            <span class="badge">
                ${s.number}
            </span>

        `;


        button.onclick=()=>{
            openSurah(s.number);
        };


        wrapper.appendChild(button);


        list.appendChild(wrapper);

    });

}


/*
==================================================
OPEN SURAH
==================================================
*/

async function openSurah(number){

    try{

        currentSurah=
            surahs.find(
                s=>s.number===number
            );


        currentIndex=0;

        translationTurn=false;


        $("reader").innerHTML=
        `
        <div class="loading">
            قرآن لوڈ ہو رہا ہے...
        </div>
        `;


        const [arabic,urdu]=
            await Promise.all([

                fetch(
                    API+
                    `/surah/${number}/quran-uthmani`
                ).then(r=>r.json()),

                fetch(
                    API+
                    `/surah/${number}/ur.jalandhry`
                ).then(r=>r.json())

            ]);


        verses=
            arabic.data.ayahs.map(
                (ayah,index)=>({

                    number:
                        ayah.numberInSurah,

                    arabic:
                        ayah.text,

                    urdu:
                        urdu.data.ayahs[index]
                        ?
                        urdu.data.ayahs[index].text
                        :
                        ""

                })
            );


        renderReader();


        updatePlayer();


        topPage();

    }

    catch(error){

        console.error(error);

        $("reader").innerHTML=
        `
        <div class="empty">
        اس سورت کا ڈیٹا لوڈ نہیں ہو سکا۔
        </div>
        `;

    }

}


/*
==================================================
RENDER QURAN
==================================================
*/

function renderReader(){

    if(!currentSurah)return;


    let html=`

    <div class="surah-header">

        <h2>
            ${currentSurah.name}
        </h2>

        <p>
            ${currentSurah.englishName}
            •
            ${currentSurah.numberOfAyahs}
            آیات
        </p>

    </div>

    `;


    verses.forEach((verse,index)=>{

        const arabicHidden=
            mode==="urdu"
            ?
            "hidden"
            :
            "";


        const urduHidden=
            mode==="arabic"
            ?
            "hidden"
            :
            "";


        html+=`

        <article
            class="ayah"
            id="ayah-${index}"
        >

            <div class="ayah-number">
                آیت ${verse.number}
            </div>


            <div
                class="arabic ${arabicHidden}"
            >
                ${verse.arabic}
            </div>


            <div
                class="urdu ${urduHidden}"
            >
                ${verse.urdu}
            </div>


            <button
                class="ayah-play"
                onclick="playAyah(${index})"
                title="آیت چلائیں"
            >
                ▶
            </button>

        </article>

        `;

    });


    $("reader").innerHTML=html;

}


/*
==================================================
PLAY SELECTED AYAH
==================================================
*/

function playAyah(index){

    if(!verses[index])return;

    currentIndex=index;

    translationTurn=
        mode==="urdu";

    loadCurrentAudio();

}


/*
==================================================
GET CURRENT AUDIO
==================================================
*/

function getCurrentAudio(){

    if(!currentSurah ||
       !verses[currentIndex]){

        return "";

    }


    const ayah=
        verses[currentIndex];


    if(mode==="arabic"){

        return arabicAudio(
            currentSurah.number,
            ayah.number
        );

    }


    if(mode==="urdu"){

        return urduAudio(
            currentSurah.number,
            ayah.number
        );

    }


    if(translationTurn){

        return urduAudio(
            currentSurah.number,
            ayah.number
        );

    }


    return arabicAudio(
        currentSurah.number,
        ayah.number
    );

}


/*
==================================================
LOAD AUDIO
==================================================
*/

async function loadCurrentAudio(){

    const source=
        getCurrentAudio();


    if(!source)return;


    audio.pause();

    audio.src=source;

    audio.load();


    updatePlayer();


    markPlaying();


    try{

        await audio.play();

        playing=true;

        $("playButton").textContent="Ⅱ";

        $("audioStatus").textContent=
            "آڈیو چل رہی ہے";

    }

    catch(error){

        playing=false;

        $("playButton").textContent="▶";

        $("audioStatus").textContent=
            "آڈیو شروع نہیں ہو سکی";

        console.error(error);

    }

}


/*
==================================================
PLAY / PAUSE
==================================================
*/

$("playButton").onclick=async()=>{

    if(!currentSurah)return;


    if(playing){

        audio.pause();

        playing=false;

        $("playButton").textContent="▶";

        $("audioStatus").textContent=
            "روکا گیا";

    }

    else{

        if(!audio.src){

            loadCurrentAudio();

        }

        else{

            try{

                await audio.play();

                playing=true;

                $("playButton").textContent="Ⅱ";

                $("audioStatus").textContent=
                    "آڈیو چل رہی ہے";

            }

            catch(error){

                console.error(error);

            }

        }

    }

};


/*
==================================================
FORWARD
LEFT BUTTON
==================================================
*/

$("nextButton").onclick=()=>{

    if(!currentSurah)return;


    if(
        mode==="both"
        &&
        !translationTurn
    ){

        translationTurn=true;

        loadCurrentAudio();

        return;

    }


    if(
        currentIndex<
        verses.length-1
    ){

        currentIndex++;

        translationTurn=
            mode==="urdu";

        loadCurrentAudio();

    }

    else{

        $("audioStatus").textContent=
            "سورت مکمل ہو گئی";

    }

};


/*
==================================================
REVERSE
RIGHT BUTTON
==================================================
*/

$("previousButton").onclick=()=>{

    if(!currentSurah)return;


    if(
        mode==="both"
        &&
        translationTurn
    ){

        translationTurn=false;

        loadCurrentAudio();

        return;

    }


    if(currentIndex>0){

        currentIndex--;

        translationTurn=
            mode==="urdu";

        loadCurrentAudio();

    }

    else{

        $("audioStatus").textContent=
            "یہ پہلی آیت ہے";

    }

};


/*
==================================================
AUTO NEXT
==================================================
*/

audio.addEventListener(
    "ended",
    ()=>{

        if(
            mode==="both"
            &&
            !translationTurn
        ){

            translationTurn=true;

            loadCurrentAudio();

            return;

        }


        if(
            currentIndex<
            verses.length-1
        ){

            currentIndex++;

            translationTurn=
                mode==="urdu";

            loadCurrentAudio();

        }

        else{

            playing=false;

            $("playButton").textContent="▶";

            $("audioStatus").textContent=
                "سورت مکمل ہو گئی";

        }

    }
);


/*
==================================================
PLAYER INFO
==================================================
*/

function updatePlayer(){

    if(!currentSurah)return;


    const ayah=
        verses[currentIndex];


    let type="";


    if(mode==="arabic"){

        type="تلاوت";

    }

    else if(mode==="urdu"){

        type="اردو ترجمہ";

    }

    else{

        type=
            translationTurn
            ?
            "اردو ترجمہ"
            :
            "تلاوت";

    }


    $("playerInfo").textContent=
        `${currentSurah.name} • آیت ${ayah?.number||""} • ${type}`;

}


/*
==================================================
HIGHLIGHT CURRENT AYAH
==================================================
*/

function markPlaying(){

    document
        .querySelectorAll(".ayah.playing")
        .forEach(
            e=>e.classList.remove("playing")
        );


    const current=
        document.getElementById(
            "ayah-"+currentIndex
        );


    if(current){

        current.classList.add("playing");

        current.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

}


/*
==================================================
MODES
==================================================
*/

document
.querySelectorAll(".mode")
.forEach(button=>{

    button.onclick=()=>{

        document
        .querySelectorAll(".mode")
        .forEach(
            b=>b.classList.remove("active")
        );


        button.classList.add("active");


        mode=
            button.dataset.mode;


        translationTurn=
            mode==="urdu";


        if(currentSurah){

            renderReader();

            loadCurrentAudio();

        }

    };

});


/*
==================================================
SEARCH
==================================================
*/

$("search").addEventListener(
    "input",
    event=>{

        renderSurahs(
            event.target.value.trim()
        );

    }
);


/*
==================================================
TOP
==================================================
*/

function topPage(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/*
==================================================
PWA SERVICE WORKER
==================================================
*/

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(
        "load",
        ()=>{

            navigator.serviceWorker
            .register("./sw.js")
