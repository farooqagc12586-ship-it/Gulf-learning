<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم - اردو ترجمہ اور آڈیو</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #1b5e20;
            margin-bottom: 20px;
        }
        .controls {
            margin-bottom: 25px;
        }
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin: 5px;
        }
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .ayah-card {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            text-align: right;
        }
        .arabic {
            font-size: 26px;
            color: #2c3e50;
            line-height: 1.8;
            margin-bottom: 8px;
        }
        .urdu {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        audio {
            width: 100%;
            margin-top: 5px;
            height: 35px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>القرآن الكريم (اردو ترجمہ و آڈیو)</h1>

    <div class="controls">
        <label for="surahSelect">سورۃ منتخب کریں:</label>
        <select id="surahSelect"></select>
        <button onclick="loadSurah()">کھولیں</button>
    </div>

    <div id="quranContainer">
        <p>براہِ کرم سورۃ منتخب کر کے "کھولیں" کا بٹن دبائیں۔</p>
    </div>
</div>

<script>
    // سورتوں کی فہرست لوڈ کرنا
    async function loadSurahList() {
        const response = await fetch('https://api.alquran.cloud/v1/surah');
        const data = await response.json();
        const select = document.getElementById('surahSelect');
        
        data.data.forEach(surah => {
            let option = document.createElement('option');
            option.value = surah.number;
            option.textContent = `${surah.number}. ${surah.name} (${surah.englishName})`;
            select.appendChild(option);
        });
    }

    // منتخب سورۃ کا عربی متن، اردو ترجمہ اور آڈیو لوڈ کرنا
    async function loadSurah() {
        const surahNumber = document.getElementById('surahSelect').value;
        const container = document.getElementById('quranContainer');
        container.innerHTML = '<p>لوڈ ہو رہا ہے...</p>';

        try {
            // عربی، اردو ترجمہ (جالندھری) اور آڈیو (مشاری العفاسی) ایک ساتھ حاصل کریں
            const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,ur.jalandhry,ar.alafasy`);
            const data = await response.json();

            const arabicAyahs = data.data[0].ayahs;
            const urduAyahs = data.data[1].ayahs;
            const audioAyahs = data.data[2].ayahs;

            let html = '';

            for (let i = 0; i < arabicAyahs.length; i++) {
                html += `
                    <div class="ayah-card">
                        <div class="arabic">${arabicAyahs[i].text} ﴿${arabicAyahs[i].numberInSurah}﴾</div>
                        <div class="urdu">${urduAyahs[i].text}</div>
                        <audio controls preload="none">
                            <source src="${audioAyahs[i].audio}" type="audio/mpeg">
                            آپ کا براؤزر آڈیو پلیئر کو سپورٹ نہیں کرتا۔
                        </audio>
                    </div>
                `;
            }

            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = '<p>لوڈ کرنے میں مسئلہ آیا ہے۔ دوبارہ کوشش کریں۔</p>';
            console.error(error);
        }
    }

    // پیج لوڈ ہوتے ہی سورتوں کی لسٹ حاصل کریں
    loadSurahList();
</script>

</body>
</html>
