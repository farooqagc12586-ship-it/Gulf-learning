<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Grammar Online Examination</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0f172a12;margin-bottom:18px}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{font-weight:700;font-size:14px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:5px;font-size:15px}.btn{border:0;border-radius:10px;padding:12px 16px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.green{background:#15803d}.red{background:#dc2626}.muted{color:#64748b}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.timer{font-size:24px;font-weight:800;color:#b91c1c}.answers{display:grid;gap:12px;margin:20px 0}.answer{text-align:left;background:#eff6ff;color:#172033;border:2px solid #bfdbfe}.answer:hover{background:#dbeafe}.answer:disabled{opacity:1}.nav{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.num{padding:9px 0;border:0;border-radius:7px;background:#e2e8f0;cursor:pointer}.num.current{outline:3px solid #2563eb}.num.done{background:#16a34a;color:white}.num.locked{cursor:not-allowed}.hidden{display:none}.result{font-size:18px}.pass{color:#15803d}.fail{color:#b91c1c}@media(max-width:650px){.grid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(8,1fr)}.timer{font-size:20px}}@media print{.no-print{display:none!important}.card{box-shadow:none}}</style></head><body><main class="wrap"><section id="registration" class="card"><h1>English Grammar Online Examination</h1><p class="muted">Class 6–8 • 100 MCQs • 100 Marks • Duration: 3 Hours</p><div class="grid"><label>Student Name<input id="studentName" required></label><label>Register Number<input id="registerNo" required></label><label>WhatsApp Number<input id="whatsapp" required></label><label>Class Category<select id="classCat"><option value="">Select class</option><option>Class 6</option><option>Class 7</option><option>Class 8</option></select></label><label>Subject<select id="subject"><option value="">Select subject</option><option>English Grammar</option></select></label><label>Previous Record<input id="previousRecord" placeholder="Example: First attempt" required></label></div><p><label><input type="checkbox" id="agree" style="width:auto"> I have read and understood the examination instructions.</label></p><button class="btn" id="startBtn">Start Examination</button><p id="regError" class="fail"></p></section><section id="exam" class="hidden"><div class="card top"><div><h2>English Grammar Examination</h2><div id="studentInfo" class="muted"></div></div><div class="timer" id="timer">03:00:00</div></div><div class="card"><div class="top"><strong id="counter">Answered: 0 / 100</strong><strong id="qLabel">Question 1 of 100</strong></div><h2 id="question"></h2><div id="answers" class="answers"></div><div class="top no-print"><button class="btn" id="prevBtn">Previous</button><button class="btn" id="nextBtn">Next</button><button class="btn red" id="submitBtn">Submit Examination</button></div></div><div class="card no-print"><h3>Question Navigation</h3><div id="nav" class="nav"></div><p class="muted">Green = submitted. Blue outline = current question. Submitted answers cannot be changed.</p></div></section><section id="result" class="hidden card"><h1>Examination Result</h1><div id="resultText" class="result"></div><br><button class="btn no-print" onclick="window.print()">Print Result</button> <button class="btn no-print" id="newBtn">Start New Examination</button></section></main><script>const QUESTIONS = [{"q": "Which word is a proper noun?", "o": ["city", "school", "London", "river"], "a": 2}, {"q": "What is the plural of “child”?", "o": ["childs", "children", "childes", "childrens"], "a": 1}, {"q": "Which is an abstract noun?", "o": ["table", "honesty", "teacher", "book"], "a": 1}, {"q": "Choose the collective noun: A ___ of birds.", "o": ["pack", "flock", "herd", "bunch"], "a": 1}, {"q": "Which noun is countable?", "o": ["water", "rice", "apple", "milk"], "a": 2}, {"q": "Choose the correct pronoun: Sara is kind. ___ helps everyone.", "o": ["He", "She", "It", "They"], "a": 1}, {"q": "This book belongs to me. It is ___.", "o": ["my", "mine", "me", "I"], "a": 2}, {"q": "___ are my shoes.", "o": ["This", "That", "These", "It"], "a": 2}, {"q": "Ali hurt ___ while playing.", "o": ["him", "himself", "his", "he"], "a": 1}, {"q": "Choose the correct pronoun: Ahmed and I went home. ___ were tired.", "o": ["We", "They", "Us", "Them"], "a": 0}, {"q": "Which word is an adjective?", "o": ["quickly", "beauty", "beautiful", "beautify"], "a": 2}, {"q": "What is the comparative form of “good”?", "o": ["gooder", "best", "better", "more good"], "a": 2}, {"q": "This is the ___ building in the town.", "o": ["tall", "taller", "tallest", "most tall"], "a": 2}, {"q": "Choose the adjective: The red car is fast.", "o": ["red", "car", "is", "fast"], "a": 0}, {"q": "Which word describes a noun?", "o": ["verb", "adjective", "adverb", "conjunction"], "a": 1}, {"q": "Choose the main verb: She sings beautifully.", "o": ["She", "sings", "beautifully", "the"], "a": 1}, {"q": "Which is a helping verb?", "o": ["run", "is", "happy", "book"], "a": 1}, {"q": "He ___ football every day.", "o": ["play", "plays", "playing", "played"], "a": 1}, {"q": "They ___ dinner now.", "o": ["eat", "eats", "are eating", "ate"], "a": 2}, {"q": "She ___ her homework already.", "o": ["has finished", "finish", "finishes", "finishing"], "a": 0}, {"q": "We ___ to school yesterday.", "o": ["go", "goes", "went", "going"], "a": 2}, {"q": "I ___ TV when he called.", "o": ["watch", "watched", "was watching", "am watching"], "a": 2}, {"q": "By noon, they ___ the work.", "o": ["finish", "finished", "had finished", "finishing"], "a": 2}, {"q": "Tomorrow, I ___ my uncle.", "o": ["visit", "visited", "will visit", "visiting"], "a": 2}, {"q": "At 8 p.m. tomorrow, she ___ dinner.", "o": ["cooks", "cooked", "will be cooking", "has cooked"], "a": 2}, {"q": "The boys ___ playing outside.", "o": ["is", "am", "are", "was"], "a": 2}, {"q": "Neither Ali nor his friends ___ ready.", "o": ["is", "am", "was", "are"], "a": 3}, {"q": "My father ___ a car.", "o": ["have", "has", "having", "had have"], "a": 1}, {"q": "The news ___ true.", "o": ["are", "were", "is", "be"], "a": 2}, {"q": "Each student ___ a pencil.", "o": ["have", "has", "are having", "were"], "a": 1}, {"q": "I saw ___ elephant.", "o": ["a", "an", "the", "no article"], "a": 1}, {"q": "She is ___ honest girl.", "o": ["a", "an", "the", "no article"], "a": 1}, {"q": "The sun rises in ___ east.", "o": ["a", "an", "the", "no article"], "a": 2}, {"q": "He bought ___ new pen.", "o": ["a", "an", "the", "no article"], "a": 0}, {"q": "We live ___ Riyadh.", "o": ["at", "on", "in", "by"], "a": 2}, {"q": "The book is ___ the table.", "o": ["in", "on", "at", "to"], "a": 1}, {"q": "She arrived ___ Monday.", "o": ["in", "on", "at", "by"], "a": 1}, {"q": "He is good ___ mathematics.", "o": ["in", "on", "at", "for"], "a": 2}, {"q": "I went home ___ bus.", "o": ["on", "by", "in", "with"], "a": 1}, {"q": "The cat jumped ___ the wall.", "o": ["over", "at", "in", "for"], "a": 0}, {"q": "I was tired, ___ I continued working.", "o": ["because", "but", "or", "so"], "a": 1}, {"q": "Hurry up, ___ you will miss the bus.", "o": ["and", "but", "or", "because"], "a": 2}, {"q": "She stayed home ___ she was ill.", "o": ["although", "because", "but", "and"], "a": 1}, {"q": "He speaks ___.", "o": ["slow", "slowly", "slowness", "slower"], "a": 1}, {"q": "I have ___ finished my work.", "o": ["already", "very", "tomorrow", "there"], "a": 0}, {"q": "They arrived ___.", "o": ["yesterday", "beautiful", "quick", "honest"], "a": 0}, {"q": "The baby is sleeping ___.", "o": ["quietly", "quiet", "quieten", "quieter"], "a": 0}, {"q": "Which is an interjection?", "o": ["Wow!", "under", "because", "quickly"], "a": 0}, {"q": "The teacher praised the student. The sentence is in ___ voice.", "o": ["passive", "active", "future", "negative"], "a": 1}, {"q": "The letter was written by Sara. This is ___ voice.", "o": ["active", "passive", "direct", "interrogative"], "a": 1}, {"q": "Change to passive: “Ali opened the door.”", "o": ["The door opened Ali.", "The door was opened by Ali.", "Ali was opened by the door.", "The door is opening."], "a": 1}, {"q": "He said, “I am tired.” Reported speech:", "o": ["He said that I am tired.", "He said that he was tired.", "He says he tired.", "He said he is tired."], "a": 1}, {"q": "She said, “I can swim.”", "o": ["She said that she could swim.", "She said that she can swam.", "She says she could swim.", "She said I swim."], "a": 0}, {"q": "A sentence that asks a question is ___.", "o": ["imperative", "exclamatory", "interrogative", "declarative"], "a": 2}, {"q": "“Please close the door.” is ___.", "o": ["interrogative", "imperative", "exclamatory", "negative"], "a": 1}, {"q": "“What a beautiful day!” is ___.", "o": ["exclamatory", "imperative", "interrogative", "negative"], "a": 0}, {"q": "The subject of “The little boy runs fast” is ___.", "o": ["runs fast", "little boy", "The little boy", "fast"], "a": 2}, {"q": "Choose the negative sentence.", "o": ["He plays cricket.", "He does not play cricket.", "Does he play cricket?", "Play cricket."], "a": 1}, {"q": "___ you like tea?", "o": ["Are", "Do", "Does", "Is"], "a": 1}, {"q": "You are coming, ___?", "o": ["aren’t you", "are you", "don’t you", "isn’t it"], "a": 0}, {"q": "Choose the correctly punctuated sentence.", "o": ["where are you going?", "Where are you going?", "Where are you going.", "where are you going."], "a": 1}, {"q": "Which word needs a capital letter?", "o": ["monday", "book", "school", "teacher"], "a": 0}, {"q": "Choose the correct spelling.", "o": ["seperate", "separate", "seprate", "seperete"], "a": 1}, {"q": "Choose the correct spelling.", "o": ["necessary", "neccessary", "necessery", "necesary"], "a": 0}, {"q": "What is the contraction of “do not”?", "o": ["doesnt", "dont", "don’t", "didnt"], "a": 2}, {"q": "The opposite of “ancient” is ___.", "o": ["old", "modern", "past", "early"], "a": 1}, {"q": "A synonym of “happy” is ___.", "o": ["sad", "angry", "joyful", "weak"], "a": 2}, {"q": "“Flower” and “flour” are ___.", "o": ["antonyms", "homophones", "verbs", "prefixes"], "a": 1}, {"q": "The opposite of “increase” is ___.", "o": ["grow", "decrease", "improve", "rise"], "a": 1}, {"q": "A synonym of “begin” is ___.", "o": ["end", "start", "stop", "close"], "a": 1}, {"q": "Choose the prefix in “unhappy”.", "o": ["happy", "un", "ness", "ly"], "a": 1}, {"q": "Choose the suffix in “careless”.", "o": ["care", "less", "car", "ess"], "a": 1}, {"q": "What does “replay” mean?", "o": ["play again", "play before", "stop playing", "play badly"], "a": 0}, {"q": "Choose the correct word: I have ___ books.", "o": ["much", "many", "any water", "a little"], "a": 1}, {"q": "There is ___ milk in the glass.", "o": ["many", "few", "some", "several"], "a": 2}, {"q": "She is taller ___ her sister.", "o": ["then", "than", "that", "to"], "a": 1}, {"q": "He has lived here ___ 2020.", "o": ["for", "since", "from", "at"], "a": 1}, {"q": "We have waited ___ two hours.", "o": ["since", "for", "at", "on"], "a": 1}, {"q": "Choose the correct sentence.", "o": ["She don’t like tea.", "She doesn’t likes tea.", "She doesn’t like tea.", "She not like tea."], "a": 2}, {"q": "Choose the correct sentence.", "o": ["He go to school.", "He goes to school.", "He going school.", "He gone school."], "a": 1}, {"q": "Choose the correct sentence.", "o": ["I am agree.", "I agree.", "I agreeing.", "I does agree."], "a": 1}, {"q": "Choose the correct sentence.", "o": ["There is five boys.", "There are five boys.", "There be five boys.", "There am five boys."], "a": 1}, {"q": "Choose the correct sentence.", "o": ["Me and Ali went.", "Ali and me went.", "Ali and I went.", "I and Ali goes."], "a": 2}, {"q": "Which sentence is in the present perfect tense?", "o": ["I eat lunch.", "I ate lunch.", "I have eaten lunch.", "I am eating lunch."], "a": 2}, {"q": "Which sentence is in the past continuous tense?", "o": ["They played.", "They were playing.", "They have played.", "They play."], "a": 1}, {"q": "Which sentence is in the future tense?", "o": ["She will travel.", "She travels.", "She travelled.", "She is travelling yesterday."], "a": 0}, {"q": "Which word is an adverb of frequency?", "o": ["always", "blue", "teacher", "under"], "a": 0}, {"q": "Which word is a preposition?", "o": ["and", "under", "quickly", "happy"], "a": 1}, {"q": "Which word is a conjunction?", "o": ["because", "slowly", "table", "green"], "a": 0}, {"q": "Which word is a verb?", "o": ["beautiful", "run", "honesty", "quickly"], "a": 1}, {"q": "What is the plural of “mouse”?", "o": ["mouses", "mice", "mousees", "meese"], "a": 1}, {"q": "What is the feminine form of “king”?", "o": ["woman", "queen", "lady", "girl"], "a": 1}, {"q": "Choose the correct question tag: He is late, ___?", "o": ["is he", "isn’t he", "does he", "wasn’t he"], "a": 1}, {"q": "Which sentence has a transitive verb?", "o": ["The baby slept.", "Birds fly.", "She opened the window.", "He laughed."], "a": 2}, {"q": "Which sentence has an intransitive verb?", "o": ["He kicked the ball.", "She wrote a letter.", "The baby slept.", "They built a house."], "a": 2}, {"q": "Choose the correct comparative sentence.", "o": ["Ali is tall than Ahmed.", "Ali is taller than Ahmed.", "Ali is tallest than Ahmed.", "Ali more tall Ahmed."], "a": 1}, {"q": "Which is an uncountable noun?", "o": ["chair", "bottle", "sugar", "apple"], "a": 2}, {"q": "Choose the correct article: He is ___ university student.", "o": ["a", "an", "the", "no article"], "a": 0}, {"q": "Choose the correct preposition: The train arrived ___ time.", "o": ["on", "in", "at", "by"], "a": 0}, {"q": "Choose the correct sentence.", "o": ["She can sings.", "She can sing.", "She can singing.", "She can sang."], "a": 1}, {"q": "Choose the correct form: If it rains, we ___ home.", "o": ["stay", "will stay", "stayed", "staying"], "a": 1}, {"q": "What is the meaning of “generous”?", "o": ["willing to give", "very angry", "unable to walk", "very small"], "a": 0}, {"q": "Choose the best title for a paragraph about saving trees.", "o": ["A Visit to the Zoo", "Protect Our Trees", "My New Shoes", "A Rainy Day"], "a": 1}];
const KEY='grammar_exam_v1';let state=null, current=0, timerId=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function format(s){s=Math.max(0,s);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(){if(!state)return;const q=QUESTIONS[current];$('qLabel').textContent=`Question ${current+1} of 100`;$('question').textContent=q.q;$('counter').textContent=`Answered: ${state.answers.filter(x=>x!==null).length} / 100`;const box=$('answers');box.innerHTML='';q.o.forEach((op,i)=>{const b=document.createElement('button');b.className='btn answer';b.textContent=String.fromCharCode(65+i)+'. '+op;b.disabled=state.answers[current]!==null||state.finished;b.onclick=()=>{if(state.answers[current]===null){state.answers[current]=i;save();render();if(current<99){current++;render()}}};box.appendChild(b)});$('prevBtn').disabled=current===0;$('nextBtn').disabled=current===99;const nav=$('nav');nav.innerHTML='';QUESTIONS.forEach((_,i)=>{const b=document.createElement('button');b.className='num '+(i===current?'current ':'')+(state.answers[i]!==null?'done ':'')+(state.answers[i]!==null?'locked':'');b.textContent=i+1;b.onclick=()=>{current=i;render()};nav.appendChild(b)})}function finish(auto=false){if(state.finished)return;state.finished=true;state.endTime=Date.now();state.auto=auto;save();clearInterval(timerId);let correct=0,attempted=0;state.answers.forEach((a,i)=>{if(a!==null){attempted++;if(a===QUESTIONS[i].a)correct++}});let unanswered=100-attempted,percent=correct; $('exam').classList.add('hidden');$('result').classList.remove('hidden');$('resultText').innerHTML=`<p><b>Student Name:</b> ${state.student.name}</p><p><b>Register Number:</b> ${state.student.reg}</p><p><b>Class:</b> ${state.student.cls}</p><p><b>Subject:</b> ${state.student.subject}</p><hr><p>Total Questions: 100</p><p>Attempted: ${attempted}</p><p>Correct Answers: ${correct}</p><p>Incorrect Answers: ${attempted-correct}</p><p>Unanswered: ${unanswered}</p><p>Total Marks: <b>${correct} / 100</b></p><p>Percentage: <b>${percent}%</b></p><p class="${correct>=40?'pass':'fail'}"><b>Status: ${correct>=40?'PASS':'FAIL'}</b></p><p>${auto?'Time is over. Your examination has been automatically submitted.':'Your examination has been submitted successfully.'}</p>`}function tick(){const left=Math.ceil((state.startTime+10800000-Date.now())/1000);$('timer').textContent=format(left);if(left<=0)finish(true)}$('startBtn').onclick=()=>{if(!$('studentName').value||!$('registerNo').value||!$('whatsapp').value||!$('classCat').value||!$('subject').value||!$('previousRecord').value||!$('agree').checked){$('regError').textContent='Please complete all six fields and accept the instructions.';return}state={student:{name:$('studentName').value,reg:$('registerNo').value,wa:$('whatsapp').value,cls:$('classCat').value,subject:$('subject').value,previous:$('previousRecord').value},startTime:Date.now(),answers:Array(100).fill(null),finished:false};save();$('registration').classList.add('hidden');$('exam').classList.remove('hidden');$('studentInfo').textContent=`${state.student.name} • ${state.student.reg} • ${state.student.cls} • ${state.student.subject}`;render();tick();timerId=setInterval(tick,1000)};$('prevBtn').onclick=()=>{if(current>0){current--;render()}};$('nextBtn').onclick=()=>{if(current<99){current++;render()}};$('submitBtn').onclick=()=>{if(confirm('Are you sure you want to submit? Once submitted, answers cannot be changed.'))finish(false)};$('newBtn').onclick=()=>{localStorage.removeItem(KEY);location.reload()};(function restore(){const raw=localStorage.getItem(KEY);if(raw){state=JSON.parse(raw);if(state.finished){finish(state.auto)}else if(Date.now()<state.startTime+10800000){$('registration').classList.add('hidden');$('exam').classList.remove('hidden');$('studentInfo').textContent=`${state.student.name} • ${state.student.reg} • ${state.student.cls} • ${state.student.subject}`;render();tick();timerId=setInterval(tick,1000)}else finish(true)}})();</script></body></html>
