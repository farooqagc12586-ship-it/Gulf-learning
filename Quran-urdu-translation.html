<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran Urdu Translation</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #f4f7f6;
  font-family: Arial, sans-serif;
}

.card {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 4px 15px #0001;
  text-align: center;
}

.arabic {
  font-size: 30px;
  color: #14532d;
  background: #f0fdf4;
  padding: 20px;
  border-radius: 12px;
  line-height: 2;
}

.translation {
  font-size: 20px;
  text-align: right;
  background: #f8fafc;
  padding: 18px;
  border-right: 5px solid #16a34a;
  border-radius: 8px;
  line-height: 2;
}
</style>
</head>

<body>

<div class="card">

  <h2>سورۃ الفاتحہ</h2>
  <p>آیت نمبر 1</p>

  <h3>عربی آیت</h3>

  <div class="arabic">
    بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  </div>

  <h3>اردو ترجمہ — شمشاد علی خان</h3>

  <div class="translation">
    یہاں شمشاد علی خان کا اصل ترجمہ لکھیں۔
  </div>

</div>

</body>
</html>
